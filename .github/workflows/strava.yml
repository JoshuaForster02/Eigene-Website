name: Strava-Werte aktualisieren
on:
  schedule:
    - cron: '17 4 * * *'   # täglich ca. 06:17 Uhr (MESZ)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Strava abrufen
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: node scripts/strava-sync.mjs
      - name: Änderungen committen
        run: |
          git config user.name "strava-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/strava.json
          git diff --cached --quiet || (git commit -m "Strava-Werte aktualisiert" && git push)
