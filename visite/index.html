 return rows.filter(r=>r.st!=='abgesetzt').map(line).join('\n')+(rows.some(r=>r.st==='abgesetzt')?'\n\nAbgesetzt:\n'+rows.filter(r=>r.st==='abgesetzt').map(line).join('\n'):'');

function ckdepi(cr,age,f){const k=f?0.7:0.9,a=f?-0.241:-0.302;let e=142*Math.pow(Math.min(cr/k,1),a)*Math.pow(Math.max(cr/k,1),-1.2)*Math.pow(0.9938,age);if(f)e*=1.012;return e}
function medPt(){const m=medState;const age=num(m.age),kg=num(m.kg),kr=num(m.krea);let egfr=num(m.egfr),crcl=NaN;
 if(!(egfr>0)&&kr>0&&age>0)egfr=ckdepi(kr,age,m.sex==='w');
 if(kr>0&&age>0&&kg>0)crcl=(140-age)*kg/(72*kr)*(m.sex==='w'?0.85:1);
 return {age:age||0,kg:kg||0,krea:kr||0,egfr:egfr>0?Math.round(egfr):0,crcl:crcl>0?Math.round(crcl):0,k:num(m.k)||0,na:num(m.na)||0,qtc:num(m.qtc)||0}}

function renderFb(f){
 if(!f||typeof f!=='object')return '';
 const stCls={gut:'ok','ausbaufähig':'warn',fehlt:'crit'};
 const list=(t,a)=>Array.isArray(a)&&a.length?`<div><h4 style="margin-top:6px">${t}</h4><ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:'';
 const pts=Number(f.punkte);
 return `<div class="fb" style="margin-top:14px">
 <div class="score-ring"><b style="color:${pts>=80?'var(--ok)':pts>=60?'var(--warn)':'var(--crit)'}">${Number.isFinite(pts)?pts:'–'}</b><div><div class="eyebrow">von 100 Punkten${f.note?' · Note '+esc(f.note):''}</div><p style="margin-top:4px">${esc(f.fazit||'')}</p></div></div>

  <div class="chips" style="margin-bottom:14px">${cats.map(c=>`<button class="chip" data-tbcat="${esc(c)}" aria-pressed="${S.tbCat===c}">${esc(c)}</button>`).join('')}</div>
  <div class="ref-grid tbgrid">${rows.map(x=>`<section class="panel rcard"><h3>${esc(x.t)}<span class="tag">${esc(x.c)}</span></h3><div class="copyblock tb"><p style="white-space:pre-line">${esc(x.x)}</p><button class="btn sm" data-copy="${esc(x.x)}">${ic('copy')}Kopieren</button></div></section>`).join('')||'<p class="empty">Kein Treffer</p>'}</div>
  <p class="faint" style="font-size:12.5px;margin-top:10px">Platzhalter „…“ ersetzen. Mehr Bausteine je Briefabschnitt findest du direkt im Arztbrief unter „Bausteine“.</p>`}
 else if(S.refTab==='ku'){b=`<div class="row" style="margin-bottom:14px;justify-content:space-between"><p class="muted" style="max-width:62ch">Unauffällige Untersuchungsbefunde als Textbausteine. Zum Anklicken statt Tippen gibt es den Befund-Baukasten im Arztbrief.</p><div class="row"><button class="btn" data-brieftool="befund">Befund-Baukasten</button><button class="btn" data-copyall-ku>${ic('copy')}Alle kopieren</button></div></div>
  <div class="ref-grid">${EXAM.map(e=>`<section class="panel rcard"><h3>${esc(e.t)}</h3><div class="copyblock"><p>${esc(e.x)}</p><button class="btn sm" data-copy="${esc(e.x)}">${ic('copy')}Kopieren</button></div></section>`).join('')}</div>`}
 else if(S.refTab==='ueb'){b=`<div class="ref-grid">${HANDOVER.map(h=>`<section class="panel rcard"><h3>${esc(h.t)}</h3><div class="stack" style="gap:10px">${h.steps.map(s=>`<div style="display:grid;grid-template-columns:28px 1fr;gap:10px"><span class="mono" style="color:var(--accent);font-size:18px;font-weight:500">${esc(s[0])}</span><div><b>${esc(s[1])}</b><p class="muted" style="font-size:13.5px">${esc(s[2])}</p></div></div>`).join('')}</div></section>`).join('')}
  <section class="panel rcard"><h3>Checkliste Neuaufnahme</h3><div class="check">${ADMIT.map((a,i)=>`<label><input type="checkbox" id="adm-${i}"><span>${esc(a)}</span></label>`).join('')}</div></section></div>`}
 else{const q=S.abbrQ.toLowerCase();const rows=ABBR.filter(a=>!q||(a[0]+' '+a[1]).toLowerCase().includes(q));
  b=`<input class="input" id="abbrq" type="search" placeholder="Abkürzung suchen …" value="${esc(S.abbrQ)}" style="max-width:300px;margin-bottom:12px" aria-label="Abkürzung suchen">

 return `<div class="page-head"><div><h1>Nachschlagen</h1><p>Notfalldosen, Normwerte, Textbausteine, Normalbefunde, Übergabe.</p></div><div class="seg" role="group">${tabs.map(([k,t])=>`<button data-rtab="${k}" aria-pressed="${S.refTab===k}">${t}</button>`).join('')}</div></div>${b}`;
}

/* ================= TUTOR ================= */
const TUTOR_RULES=`Du bist ein erfahrener klinischer Tutor (Facharzt/Fachärztin) für Medizinstudierende im klinischen Abschnitt und PJ an einer deutschen Universitätsklinik. Antworte auf Deutsch, direkt und präzise, ohne Füllsätze. Orientiere dich an aktuellen deutschen und europäischen Leitlinien (AWMF, ESC, ERC) und nenne sie, wenn relevant. Bei Dosierungen kurz auf Prüfung gegen Fachinformation bzw. Klinik-SOP hinweisen. Wenn der Nutzer einen Fall üben möchte, spiele den Fall schrittweise wie in einer echten Aufnahme: Informationen nur auf Nachfrage, lass den Nutzer Diagnostik und Therapie vorschlagen und gib am Ende strukturiertes Feedback. Bei Fallvorstellungen oder Arztbriefen gib konkrete Formulierungsbeispiele. Keine Markdown-Überschriften. Es werden keine echten Patientendaten verwendet.`;
const TUTOR_STARTERS=['Spiel mit mir einen Fall in der Notaufnahme: Brustschmerz','Wie stelle ich einen Patienten auf der Visite in 60 Sekunden vor?','Erklär mir die Stufentherapie der Hyperkaliämie','Frag mich 5 Prüfungsfragen zur Pneumonie','Wie dokumentiere ich Suizidalität richtig?','Spiel mit mir eine Aufnahme auf der Unfallchirurgie'];
function vTutor(){
 return `<div class="page-head"><div><span class="eyebrow">Üben</span><h1>KI-Tutor</h1><p>Fälle üben, Fragen stellen, Fallvorstellungen korrigieren lassen.</p></div>${chat.length?`<button class="btn ghost" data-clearchat>${ic('trash')}Neuer Chat</button>`:''}</div>
 <p class="note ai-off-only" style="max-width:860px">Der Tutor braucht KI-Zugriff und ist in dieser Ansicht nicht verfügbar.</p>
 <div class="chat ai-only"><div class="msgs" id="msgs">${chat.length?chat.map(m=>`<div class="msg ${m.role==='user'?'u':'a'}">${m.role==='user'?esc(m.content):md(m.content)}</div>`).join(''):`<div class="stack" style="gap:10px;margin:auto 0"><span class="eyebrow">Vorschläge</span><div class="chips">${TUTOR_STARTERS.map(s=>`<button class="chip" data-starter="${esc(s)}">${esc(s)}</button>`).join('')}</div></div>`}</div>
 <div class="composer"><textarea class="input" id="chatin" rows="2" placeholder="Frage stellen … (Enter senden, Shift+Enter neue Zeile)"></textarea><button class="btn primary" id="chatsend" aria-label="Senden">${ic('send')}</button></div></div>`;
}
function scrollChat(){const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight}
let chatBusy=false;
async function sendChat(text){
 text=(text||'').trim();if(!text||chatBusy||!SAMPLE)return;chatBusy=true;chat.push({role:'user',content:text});render();
 const msgs=$('#msgs');const bubble=document.createElement('div');bubble.className='msg a';bubble.innerHTML='<span class="thinking"><i></i>denkt nach …</span>';msgs.appendChild(bubble);scrollChat();
 aiCtl=new AbortController();
 try{const r=await SAMPLE([{role:'user',content:TUTOR_RULES},...chat.slice(-16)],{cache:false,signal:aiCtl.signal,onText:({text})=>{bubble.innerHTML=md(text);scrollChat()}});chat.push({role:'assistant',content:r.text})}
 catch(e){if(e&&e.text)chat.push({role:'assistant',content:e.text+'\n\n(unterbrochen)'});else chat.push({role:'assistant',content:e&&e.code==='cancelled'?'(abgebrochen)':aiErr(e)})}
 finally{aiCtl=null;chatBusy=false;store.set('chat',chat.slice(-40));if(S.view==='tutor'){render();$('#chatin')&&$('#chatin').focus()}}
}

 if(ds.rtab){S.refTab=ds.rtab;render();return}

 if(ds.labcat){S.labCat=ds.labcat;render();return}

 if(ds.copy!=null){copyText(ds.copy);return}
 if(ds.copyletter){const id=ds.copyletter;if(id==='__free')copyText(letterPlain(freeMeta,draftOf('__free')));else{const c=CASES.find(x=>x.id===id);const mine=S.paperSrc==='mine';copyText(letterPlain(metaOfCase(c),mine?draftOf(id):c.muster,mine?null:c.med))}return}
 if('copyallKu' in ds){copyText(EXAM.map(x=>x.t+': '+x.x).join('\n'));return}
 if(ds.phrase!=null){const ta=$(`textarea[data-sec="${ds.for}"]`);if(!ta)return;const p=ds.phrase;const s=ta.selectionStart??ta.value.length,en=ta.selectionEnd??ta.value.length;const useCursor=ta.dataset.lastFocus==='1';const pos=useCursor?s:ta.value.length;const pre=ta.value.slice(0,pos),post=ta.value.slice(useCursor?en:pos);const sep=pre&&!/\s$/.test(pre)?(p.startsWith('–')||p.endsWith(':')?'\n':' '):'';ta.value=pre+sep+p+post;ta.focus();const np=(pre+sep+p).length;ta.setSelectionRange(np,np);ta.dispatchEvent(new Event('input',{bubbles:true}));return}
 if(ds.markdone){const id=ds.markdone;statusMap[id]=statusMap[id]==='done'?'wip':'done';store.set('status',statusMap);render();toast(statusMap[id]==='done'?'Als fertig markiert':'Wieder offen');return}
 if(ds.aifb){runFeedback(ds.aifb);return}
 if('aistop' in ds){aiCtl&&aiCtl.abort();return}
 if('aidraft' in ds){runDraft();return}
 if(ds.polish){polishSection(ds.polish);return}
 if(ds.extra){if(ds.extra==='menu')extraMenu();else runExtra(ds.extra);return}
 if('clearfree' in ds){if(!clearArmed){clearArmed=true;t.innerHTML=ic('trash')+'Wirklich leeren?';setTimeout(()=>{clearArmed=false;if(t.isConnected)t.innerHTML=ic('trash')+'Leeren'},3000);return}clearArmed=false;drafts.__free={};delete fbStore.__free;images=[];redactOk=false;freeMeta.notes='';store.set('free',freeMeta);store.set('drafts',drafts);store.set('fb',fbStore);render();toast('Geleert');return}
 if(ds.redact){redactId=redactId===ds.redact?null:ds.redact;$('#imglist').innerHTML=imagesHtml();drawRedactor();return}
 if('rundo' in ds){const im=images.find(i=>i.id===redactId);if(im&&im.rects.length){im.rects.pop();im.thumb=composed(im).toDataURL('image/jpeg',.6);drawRedactor()}return}
 if('rdone' in ds){redactId=null;$('#imglist').innerHTML=imagesHtml();drawRedactor();return}
 if(ds.rmimg){images=images.filter(i=>i.id!==ds.rmimg);if(redactId===ds.rmimg)redactId=null;refreshTool();return}
 if('bfto' in ds){appendTo('befund',befundText(befundState.vals,befundState.vit),{replace:true});return}
 if('bfcopy' in ds){copyText(befundText(befundState.vals,befundState.vit));return}
 if('bfreset' in ds){befundState.vals={};store.set('befund',befundState);refreshTool();return}
 if('labto' in ds){appendTo('diagnostik','Labor: '+labsToText(parseLabs(labText),store.get('labonly',true))+'.');return}
 if('labcopy' in ds){copyText('Labor: '+labsToText(parseLabs(labText),store.get('labonly',true))+'.');return}
 if(ds.icd){const x=ICD.find(i=>i[0]===ds.icd);if(x)appendTo('diagnosen',`${x[1]} (${x[0]})`);return}
 if('abglto' in ds){const txt=abgleichText();if(S.view==='brief')appendTo('medikation',txt,{replace:true});else{draftOf('__free').medikation=txt;store.set('drafts',drafts);go('brief',{mode:'write'});toast('In „Entlassmedikation“ übernommen')}return}
 if('abglcheck' in ds){medState.list=medState.after;store.set('med',medState);go('medis',{medTab:'check'});return}
 if('medexample' in ds){Object.assign(medState,MED_EXAMPLE);store.set('med',medState);render();return}
 if('medclear' in ds){Object.assign(medState,{list:'',age:'',kg:'',krea:'',egfr:'',k:'',na:'',qtc:''});store.set('med',medState);render();return}
 if('medtobrief' in ds){const L=parseMedList(medState.list);draftOf('__free').medikation=L.map(m=>`${m.name}${m.dose?' '+m.dose:''}  ${m.schema||(m.bb?'b. B.':'')}`).join('\n');store.set('drafts',drafts);go('brief',{mode:'write'});toast('In „Entlassmedikation“ übernommen');return}
 if('medai' in ds){runMedAI();return}
 if(ds.fav){const id=ds.fav;favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];store.set('favs',favs);render();return}
 if('calcback' in ds){S.calcDetail=false;render();return}
 if(ds.calcreset){delete calcVals[ds.calcreset];render();return}
 if('calccopy' in ds){copyText(lastCalcText);return}
 if('calcbrief' in ds){const d=draftOf('__free');d.diagnostik=((d.diagnostik||'').trim()?d.diagnostik.replace(/\s+$/,'')+'\n':'')+lastCalcText;store.set('drafts',drafts);toast('In „Labor & Diagnostik“ übernommen');return}
 if(ds.starter){sendChat(ds.starter);return}
 if(t.id==='chatsend'){const ta=$('#chatin');const v=ta.value;ta.value='';sendChat(v);return}
 if('clearchat' in ds){if(aiCtl)aiCtl.abort();chat=[];store.set('chat',chat);render();return}

const medRerender=debounce(()=>renderMedResult(),250);

 const t=e.target;
 if(t.id==='gsearch'){doSearch(t.value);return}
 if(t.dataset.sec){const id=S.view==='case'?S.caseId:'__free';draftOf(id)[t.dataset.sec]=t.value;saveDrafts();grow(t);const w=$(`[data-wc="${t.dataset.sec}"]`);if(w)w.textContent=wc(t.value);if(id!=='__free'&&!statusMap[id]&&t.value.trim()){statusMap[id]='wip';store.set('status',statusMap)}return}
 if(t.dataset.fm){freeMeta[t.dataset.fm]=t.value;store.set('free',freeMeta);if(t.tagName==='TEXTAREA')grow(t);return}
 if(t.dataset.mstate){medState[t.dataset.mstate]=t.value;saveMed();if(t.tagName==='TEXTAREA')grow(t);if(S.view==='medis'&&S.medTab==='check')medRerender();const ab=$('#abgl');if(ab&&(t.dataset.mstate==='before'||t.dataset.mstate==='after'))ab.innerHTML=abgleichResult(diffMeds(medState.before,medState.after),S.view==='brief');return}
 if(t.dataset.vit){befundState.vit[t.dataset.vit]=t.value;updBefundPrev();return}
 if(t.dataset.bf){befundState.vals[t.dataset.bf]=+t.value;t.classList.toggle('abn',+t.value>0);updBefundPrev();return}
 if(t.dataset.boff){befundState.vals['off_'+t.dataset.boff]=t.checked;t.closest('.bsec').classList.toggle('off',t.checked);updBefundPrev();return}
 if(t.id==='labin'){labText=t.value;store.set('labtxt',labText);grow(t);const o=$('#labout');if(o)o.innerHTML=laborOut(parseLabs(labText),store.get('labonly',true));return}
 if(t.id==='labonly'){store.set('labonly',t.checked);const p=$('#labprev');if(p)p.textContent='Labor: '+labsToText(parseLabs(labText),t.checked)+'.';return}
 if(t.id==='redact-ok'){redactOk=t.checked;return}
 if(t.id==='icdq'){S.icdQ=t.value;const l=$('#icdlist');if(l)l.innerHTML=icdList();return}
 if(t.dataset.ci!=null){const c=CALCS.find(x=>x.id===S.calcId);const v=calcVals[c.id];const k=t.dataset.ci;

 if(t.id==='calcq'){S.calcQ=t.value;const pos=t.selectionStart;render();const n=$('#calcq');n.focus();n.setSelectionRange(pos,pos);return}
 if(t.id==='labq'){S.labQ=t.value;const pos=t.selectionStart;render();const n=$('#labq');n.focus();n.setSelectionRange(pos,pos);return}
 if(t.id==='tbq'){S.tbQ=t.value;const pos=t.selectionStart;render();const n=$('#tbq');n.focus();n.setSelectionRange(pos,pos);return}

 if(t.id==='chatin'){t.style.height='auto';t.style.height=Math.min(t.scrollHeight,180)+'px'}
