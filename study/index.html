<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0d12">
<title>Study OS</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<script src="config.js"></script>
<style>
:root{color-scheme:dark;--bg:#0b0d12;--ink:#f3f4f7;--muted:#8a90a0;--line:rgba(255,255,255,.12);--acc:#6d9eff}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;font:15px/1.5 -apple-system,system-ui,"Segoe UI",sans-serif;color:var(--ink);
  background:radial-gradient(60% 50% at 20% 25%,#3b4fd8 0%,transparent 60%),radial-gradient(50% 60% at 85% 20%,#b1459b 0%,transparent 60%),radial-gradient(60% 60% at 70% 90%,#0f8f86 0%,transparent 60%),var(--bg)}
main{width:min(100%,380px);text-align:center;padding:32px 26px;border-radius:22px;background:rgba(22,24,31,.72);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 0 0 .5px var(--line),0 24px 60px -12px rgba(0,0,0,.5)}
img{width:72px;height:72px;border-radius:18px}
h1{font-size:24px;font-weight:650;margin:14px 0 4px;letter-spacing:-.01em}
p{color:var(--muted);font-size:14px}
.st{margin:22px 0 18px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;color:var(--ink)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--acc);animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
a.b{display:block;padding:12px;border-radius:12px;text-decoration:none;font-weight:600;margin-top:8px}
a.p{background:var(--acc);color:#fff}
a.g{color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
a.b small{display:block;font-weight:400;font-size:12.5px;opacity:.75}
.hint{margin-top:18px;font-size:12.5px;line-height:1.55}
.back{display:inline-block;margin-top:14px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main>
  <img src="icon.svg" alt="">
  <h1>Study OS</h1>
  <p>Anki, Kalender, Fokus und Notion an einem Ort.</p>
  <div class="st" id="st"><span class="spin"></span><span>Verbinde …</span></div>
  <div id="btns" hidden></div>
  <p class="hint">Als App: nach dem Öffnen am iPhone <b>Teilen → Zum Home-Bildschirm</b>, am Mac in Safari <b>Ablage → Zum Dock hinzufügen</b>.<br>An fremden Rechnern beim Login „Öffentlicher Computer“ anhaken.</p>
  <a class="back" href="/spiele/">← Zurück</a>
</main>
<script>
(async () => {
  const C = window.STUDY_OS || {}, pi = (C.PI || '').replace(/\/$/, ''), fb = (C.FALLBACK || '').replace(/\/$/, '');
  const q = new URLSearchParams(location.search), stay = q.has('wahl'), hybrid = q.get('ziel') === 'hybrid';
  const path = hybrid ? '/' : '/study/', name = hybrid ? 'Hybrid OS' : 'Study OS';
  if (hybrid) { document.title = name; document.querySelector('h1').textContent = name; document.querySelector('main > p').textContent = 'Training: Wochenplan, Coach, Bestleistungen und Watch-Daten.'; }
  const st = document.getElementById('st'), btns = document.getElementById('btns');
  const reach = async url => {
    try { const c = new AbortController(); const t = setTimeout(() => c.abort(), 3000); await fetch(url + '/api/health', { mode: 'no-cors', cache: 'no-store', signal: c.signal }); clearTimeout(t); return true; }
    catch (e) { return false; }
  };
  const go = url => location.replace(url + path);
  const piOk = pi ? await reach(pi) : false;
  if (!stay && piOk) { st.lastChild.textContent = 'Öffne ' + name + ' auf deinem Pi …'; return go(pi); }
  if (!stay && !pi && fb) { st.lastChild.textContent = 'Öffne ' + name + ' …'; return go(fb); }
  st.innerHTML = stay ? '<span>Wohin?</span>' : '<span>Dein Pi ist gerade nicht erreichbar.</span>';
  btns.hidden = false;
  btns.innerHTML = (pi ? `<a class="b ${piOk || stay ? 'p' : 'g'}" href="${pi}${path}">${name} auf dem Pi<small>${hybrid ? 'mit deinen Pi-Daten' : 'komplett, mit Anki'}${piOk ? '' : ' · gerade offline'}</small></a>` : '')
    + (fb ? `<a class="b ${pi && (piOk || stay) ? 'g' : 'p'}" href="${fb}${path}">${name} in der Cloud<small>${hybrid ? 'Vercel-Version' : 'ohne Anki-Karten'}</small></a>` : '');
})();
</script>
</body>
</html>
