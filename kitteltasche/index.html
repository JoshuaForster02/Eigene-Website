muster:{
diagnosen:`RSV-Bronchiolitis (J21.0) mit Hypoxämie und Trinkschwäche
– High-Flow-Sauerstofftherapie (HFNC) vom 10.–12.09.2026, anschließend Low-flow bis 13.09.2026
– Sondenernährung über Magensonde vom 10.–12.09.2026

Nebendiagnosen: keine
Keine RSV-Immunisierung (Nirsevimab) erfolgt`,
anamnese:`Mia wurde durch Sie bei seit drei Tagen bestehendem Schnupfen, seit einem Tag Husten, beschleunigter Atmung und Trinkschwäche (weniger als die Hälfte der üblichen Flaschenmenge, drei nasse Windeln in 24 Stunden) überwiesen. Das Fieber lag maximal bei 38,3 °C. Der ältere Bruder (3 Jahre, Kita) ist ebenfalls erkältet.
Schwangerschaft und Geburt: reifes Neugeborenes (39+4 SSW, Geburtsgewicht 3.320 g), unauffällige Neonatalzeit.
Impfungen altersgerecht. Eine RSV-Prophylaxe mit Nirsevimab ist nicht erfolgt.
Gewicht bei Aufnahme 6,2 kg (P25), Länge 63 cm (P40).`,
befund:`4 Monate alter weiblicher Säugling in reduziertem Allgemeinzustand. AF 62/min, SpO2 89 % unter Raumluft, HF 164/min, Temperatur 38,0 °C.
Juguläre und interkostale Einziehungen, Nasenflügeln. Auskultatorisch beidseits feinblasige Rasselgeräusche und Giemen. Rekapillarisierungszeit < 2 s, Fontanelle im Niveau, Haut rosig.`,
diagnostik:`RSV-PCR (Nasopharyngealsekret): positiv.
Auf Blutentnahme und Röntgen-Thorax haben wir bei typischem klinischem Bild verzichtet.`,
epikrise:`Mia wurde mit einer RSV-Bronchiolitis mit Hypoxämie, erhöhter Atemarbeit und Trinkschwäche aufgenommen. Wir begannen eine High-Flow-Sauerstofftherapie über zwei Tage, die wir anschließend auf Low-flow-Sauerstoff reduzierten. Ab dem 13.09. lag die Sättigung unter Raumluft stabil bei mindestens 92 %. Die Ernährung erfolgte zunächst über eine Magensonde; ab dem 12.09. trank Mia wieder mehr als 75 % ihrer üblichen Menge.
Wir behandelten entsprechend der Leitlinie supportiv mit Nasenspülung und Absaugen. Auf Salbutamol, Steroide und Antibiotika verzichteten wir bei fehlender Evidenz bzw. Indikation. Ab dem 11.09. war Mia fieberfrei. Wir entlassen sie am 15.09. in gutem Allgemeinzustand (6,25 kg, AF 38/min, SpO2 97 % unter Raumluft) in Ihre weitere Betreuung.`,
procedere:`– Kinderärztliche Kontrolle in 2–3 Tagen (Trinkmenge, Atmung, Gewicht).
– Der Husten kann noch 2–4 Wochen anhalten.
– NaCl-Nasentropfen und Absaugen vor den Mahlzeiten bei Bedarf fortführen.
– Die Eltern wurden über Warnzeichen aufgeklärt: Trinkmenge unter 50 %, weniger als 3 nasse Windeln pro Tag, Atempausen, Einziehungen, bläuliche Hautfarbe. In diesen Fällen bitte sofortige Vorstellung.
– Rauchfreie Umgebung. Geschwisterkind: Händehygiene.
– Wir empfehlen die Fortführung der Impfungen nach STIKO-Kalender (U5 im 6.–7. Lebensmonat).`},
med:[['NaCl 0,9 %','Nasentropfen','1–2 Trpf. je Nasenloch vor den Mahlzeiten','bei Bedarf','neu']],
check:['Gewicht mit Perzentile','Schwangerschafts-/Geburtsanamnese','Trinkmenge und nasse Windeln quantifiziert','Sauerstofftherapie mit Art und Dauer','Ernährungsunterstützung','Begründung, warum keine Salbutamol/Steroide/Antibiose','Entlasskriterien objektiv (SpO2, Trinkmenge, AF)','Warnzeichen für Eltern','Kinderärztliche Kontrolle terminiert'],
fallen:['Keine Gewichtsangabe: In der Pädiatrie Grundlage jeder Dosierung und Verlaufsbeurteilung.','Salbutamol/Antibiotika ohne Indikation gegeben oder empfohlen.','Warnzeichen fehlen: Eltern sind die ersten Beobachter.']},

{id:'dep',fach:'psych',sub:'Allgemeinpsychiatrie',titel:'Mittelgradige depressive Episode',level:2,typ:'Entlassungsbericht',
pat:{name:'Frau Sabine M.',geb:'17.08.1985',sex:'w',alter:41},klinik:'Klinik für Psychiatrie und Psychotherapie · Station 3 (offen)',von:'01.08.2026',bis:'12.09.2026',
roh:`AUFNAHME 01.08. freiwillig, Einweisung HA
41 J., w. Seit ca. 4 Mon. gedrückte Stimmung, Interessenverlust, Freudlosigkeit, Ein- und Durchschlafstörungen (Erwachen 4 Uhr), Appetitverlust (-6 kg), Konzentrationsstörung, Grübeln, Schuldgefühle ("ich versage als Mutter"). Passive Todeswünsche ("wäre mir egal, wenn ich nicht aufwache"), keine konkreten Suizidgedanken/-pläne, keine Suizidversuche. Auslöser: Trennung vom Partner (03/26), Arbeitsbelastung (Teamleitung Versicherung). Seit 6 Wo. AU.
Erstmanifestation, keine Vorbehandlung. Keine manischen Episoden. FA: Mutter Depression.
Keine somat. VE. Keine Med. Alkohol: 1–2 Glas Wein/Woche, keine Drogen.
Sozial: 2 Kinder (9, 12 J.), leben bei ihr; Mutter unterstützt.

Psychopath. Befund (Aufnahme): wach, bewusstseinsklar, allseits orientiert. Konzentration und Auffassung reduziert, Merkfähigkeit intakt. Formal: verlangsamt, grübelnd, eingeengt auf Versagensthemen. Kein Wahn, keine Sinnestäuschungen, keine Ich-Störungen. Affekt: deutlich gedrückt, affektarm, hoffnungslos, Insuffizienz- und Schuldgefühle. Antrieb reduziert, psychomotorisch verlangsamt. Zirkadian: Morgentief. Passive Todeswünsche, von akuter Suizidalität glaubhaft distanziert, absprachefähig.
BDI-II 31, HAMD-17 21.

Somat.: unauff. Lab: BB, TSH, Elektrolyte, Leber/Niere, Vit B12, Folsäure normal. EKG: SR, QTc 418 ms. cMRT: unauffällig.

VERLAUF: Sertralin 50 mg ab 02.08., 100 mg ab 16.08. Mirtazapin 15 mg z.N. 02.08.–30.08. (Schlaf), dann ausgeschlichen.
KVT Einzel 2x/Wo, Gruppe (Depressionsbewältigung), Ergo, Sport, Achtsamkeit. Belastungserprobungen WE ab 22.08., gut.
Stimmung ab Wo. 3 besser. Schlaf normalisiert, Gew. +2 kg.
Entlassung: BDI-II 12, HAMD 8. Keine Todeswünsche. Krisenplan erstellt.
Ambulant: PIA-Termin 22.09., Psychotherapie-Erstgespräch 06.10. (Praxis Dr. X), stufenweise Wiedereingliederung ab 01.10. geplant.
EKG Kontrolle 30.08.: QTc 422 ms. Natrium 139.`,
muster:{
diagnosen:`Mittelgradige depressive Episode (F32.1), Erstmanifestation
– Mit somatischem Syndrom
– Auslösend: Trennung und berufliche Überlastung
– Bei Entlassung teilremittiert (BDI-II 31 → 12, HAMD-17 21 → 8)`,
anamnese:`Frau M. kam am 01.08. auf Einweisung ihres Hausarztes freiwillig zur Aufnahme. Sie berichtete über seit etwa vier Monaten bestehende gedrückte Stimmung, Interessen- und Freudverlust, Ein- und Durchschlafstörungen mit frühmorgendlichem Erwachen, Appetitverlust mit Gewichtsabnahme von 6 kg, Konzentrationsstörungen sowie ausgeprägtes Grübeln mit Schuldgefühlen. Sie äußerte passive Todeswünsche; konkrete Suizidgedanken, -pläne oder frühere Suizidversuche verneinte sie. Als Auslöser benannte sie die Trennung vom Partner im März sowie eine hohe Arbeitsbelastung als Teamleiterin. Seit sechs Wochen ist sie arbeitsunfähig.
Psychiatrische Vorgeschichte: Erstmanifestation, keine Vorbehandlung, keine hypomanen oder manischen Episoden. Familienanamnese: Depression der Mutter.
Somatisch: keine Vorerkrankungen, keine Dauermedikation. Suchtmittel: Alkohol 1–2 Gläser Wein pro Woche, keine Drogen.
Sozialanamnese: alleinerziehend mit zwei Kindern (9 und 12 Jahre), Unterstützung durch die eigene Mutter.`,
befund:`Psychopathologischer Befund bei Aufnahme: Wach, bewusstseinsklar, zu allen Qualitäten orientiert. Konzentration und Auffassung reduziert, Merkfähigkeit intakt. Formalgedanklich verlangsamt, grübelnd und auf Versagensthemen eingeengt. Kein Anhalt für Wahn, Sinnestäuschungen oder Ich-Störungen. Stimmung deutlich gedrückt, affektarm, hoffnungslos, mit Insuffizienz- und Schuldgefühlen. Antrieb reduziert, psychomotorisch verlangsamt. Morgentief. Passive Todeswünsche, von akuter Suizidalität glaubhaft distanziert und absprachefähig.
Psychometrie: BDI-II 31, HAMD-17 21.
Somatischer Befund: internistisch und neurologisch unauffällig.`,
diagnostik:`Labor: Blutbild, TSH, Elektrolyte, Leber- und Nierenwerte, Vitamin B12 und Folsäure im Normbereich. Natrium im Verlauf 139 mmol/l.
EKG: Sinusrhythmus, QTc 418 ms, unter Sertralin 422 ms.
cMRT: unauffällig, kein Hinweis auf organische Ursache.`,
epikrise:`Frau M. wurde mit einer erstmals aufgetretenen mittelgradigen depressiven Episode mit somatischem Syndrom aufgenommen. Eine organische Ursache schlossen wir laborchemisch und bildgebend aus. Wir begannen eine antidepressive Therapie mit Sertralin, die wir auf 100 mg steigerten. Überbrückend setzten wir bei ausgeprägter Schlafstörung für vier Wochen Mirtazapin ein und schlichen es anschließend aus. Unter Sertralin blieben QTc-Zeit und Natrium unauffällig.
Parallel nahm Frau M. an kognitiver Verhaltenstherapie im Einzel- und Gruppensetting, Ergo-, Sport- und Achtsamkeitstherapie teil. Ab der dritten Behandlungswoche besserten sich Stimmung, Antrieb und Schlaf; das Gewicht stieg um 2 kg. Belastungserprobungen am Wochenende verliefen positiv. Die passiven Todeswünsche bestehen nicht mehr. Wir erstellten gemeinsam einen Krisenplan.
Bei Entlassung am 12.09. ist die Episode teilremittiert (BDI-II 12, HAMD-17 8). Frau M. ist von Suizidalität klar distanziert.`,
procedere:`– Fortführung von Sertralin 100 mg für mindestens 6–12 Monate nach Remission, danach nur schrittweises Ausschleichen.
– Ambulante psychiatrische Weiterbehandlung in unserer Institutsambulanz, Ersttermin am 22.09.
– Ambulante Psychotherapie (KVT), Erstgespräch am 06.10. vereinbart.
– Stufenweise Wiedereingliederung ab 01.10. geplant, bis dahin Arbeitsunfähigkeit.
– Krisenplan liegt Frau M. vor. Bei Wiederauftreten von Suizidgedanken jederzeit Vorstellung in unserer Notaufnahme (24 h) möglich.
– EKG- und Natriumkontrolle bei Dosisänderung oder zusätzlichen QT-verlängernden Substanzen.`},
med:[['Sertralin','100 mg','1-0-0-0','mind. 6–12 Monate nach Remission','neu'],['Mirtazapin','15 mg','–','ausgeschlichen am 30.08.','abgesetzt']],
check:['Diagnose mit Schweregrad, Episode und ICD-10','Vollständiger psychopathologischer Befund','Suizidalität bei Aufnahme und Entlassung explizit dokumentiert','Psychometrie im Verlauf (BDI, HAMD)','Organischer Ausschluss','Pharmakotherapie mit Dosis und Dauerempfehlung','Psychotherapeutische Maßnahmen','Konkrete ambulante Anschlusstermine','Krisenplan'],
fallen:['Suizidalität bei Entlassung nicht dokumentiert: forensisch und klinisch zentral.','Psychopathologischer Befund nur „depressiv“: nicht verwertbar.','Keine Dauerempfehlung für das Antidepressivum: zu frühes Absetzen erhöht das Rückfallrisiko.']},

{id:'uro',fach:'uro',sub:'Urologie',titel:'Infizierter Harnstau bei Ureterstein',level:2,typ:'Entlassungsbericht',
pat:{name:'Herr Jonas N.',geb:'09.12.1980',sex:'m',alter:45},klinik:'Klinik für Urologie',von:'04.09.2026',bis:'07.09.2026',
roh:`AUFNAHME 04.09. ZNA
45 J., m. Seit gestern kolikartige Flankenschmerzen li. mit Ausstrahlung in Leiste, Übelkeit, 2x Erbrechen. Seit heute Fieber 38,4 + Schüttelfrost. Z.n. Nierenkolik 2021 (spontaner Abgang, keine Analyse).
Keine Dauermed., keine Allergien. Trinkt wenig (Außendienst).

KU: T 38,4, RR 124/78, HF 104. Nierenlager li. klopfdolent. Abd. weich.
Lab: Leuko 15,0, CRP 96, Krea 1,4 (Baseline unbek.), PCT 0,8. Urin: Nitrit +, Leuko +++, Ery ++.
Low-dose-CT 04.09.: Konkrement 7 mm prävesikaler Harnleiter li., Harnstau II°. Re. unauff.
Sono: Harnstau II° li.

VERLAUF: BK 2x2 + UK abgenommen, Ceftriaxon 2 g i.v. 1x/d 04.–06.09.
04.09. 16:00 Notfall: Einlage DJ-Katheter li. in Sedoanalgesie (keine Steinsanierung bei Infekt).
UK: E. coli > 10^5, sensibel Ceftriaxon, Cefpodoxim; resistent Cotrimoxazol, Ampicillin. BK: E. coli (1/2).
Entfiebert ab 05.09. Krea 1,4 -> 1,0. CRP 96 -> 38.
07.09. Oralisierung: Cefpodoxim 200 mg 1-0-1 bis 13.09. (Gesamt 10 d).
Geplant: URS li. mit Steinbergung + DJ-Entfernung am 29.09. (stationär, Aufnahme 28.09.).
Analgesie: Metamizol. DJ-Beschwerden leicht. Entlassung 07.09.`,
muster:{
diagnosen:`Infizierte Harnstauungsniere links (N13.6) bei 7 mm großem prävesikalem Ureterstein links
– E. coli-Urosepsis (Bakteriämie, E. coli in 1 von 2 Blutkulturen)
– Notfallmäßige Entlastung durch DJ-Katheter-Einlage links am 04.09.2026
– Geplante Ureterorenoskopie mit Steinbergung am 29.09.2026
Rezidivierende Urolithiasis (Z. n. Nierenkolik 2021)`,
anamnese:`Herr N. stellte sich mit seit dem Vortag bestehenden kolikartigen Flankenschmerzen links mit Ausstrahlung in die Leiste, Übelkeit und zweimaligem Erbrechen vor. Seit dem Aufnahmetag bestanden Fieber bis 38,4 °C und Schüttelfrost. 2021 hatte er bereits eine Nierenkolik mit spontanem Steinabgang (keine Steinanalyse).
Dauermedikation: keine. Allergien: keine bekannt. Beruflich im Außendienst, geringe Trinkmenge.`,
befund:`45-jähriger Patient in reduziertem Allgemeinzustand. Temperatur 38,4 °C, RR 124/78 mmHg, HF 104/min. Nierenlager links klopfschmerzhaft. Abdomen weich, kein Peritonismus.`,
diagnostik:`Labor (Aufnahme): Leukozyten 15,0/nl, CRP 96 mg/l, PCT 0,8 ng/ml, Kreatinin 1,4 mg/dl. Im Verlauf Kreatinin 1,0 mg/dl, CRP 38 mg/l.
Urinstatus: Nitrit positiv, Leukozyten +++, Erythrozyten ++.
Low-dose-CT (04.09.): 7 mm großes Konkrement im prävesikalen Harnleiter links, Harnstau II°. Rechte Niere unauffällig.
Urinkultur: E. coli > 10^5 KBE/ml, sensibel auf Ceftriaxon und Cefpodoxim, resistent gegen Cotrimoxazol und Ampicillin.
Blutkulturen: E. coli in 1 von 2 Paaren.`,
epikrise:`Herr N. wurde mit einem fieberhaften Harnstau links bei einem 7 mm großen prävesikalen Harnleiterstein aufgenommen. Da ein infizierter Harnstau ein urologischer Notfall ist, führten wir nach Abnahme von Blut- und Urinkulturen und Beginn einer kalkulierten Antibiose mit Ceftriaxon noch am Aufnahmetag die Entlastung durch Einlage eines DJ-Katheters durch. Auf eine Steinsanierung verzichteten wir bewusst wegen des floriden Infekts.
In Urin- und Blutkultur wuchs E. coli, sensibel auf die gewählte Therapie. Herr N. entfieberte ab dem 05.09., die Entzündungswerte waren rückläufig und das Kreatinin normalisierte sich. Am 07.09. stellten wir antibiogrammgerecht auf orales Cefpodoxim um. Die definitive Steinsanierung mittels Ureterorenoskopie ist für den 29.09. geplant. Wir entlassen Herrn N. am 07.09. in gutem Allgemeinzustand.`,
procedere:`– Fortführung von Cefpodoxim 200 mg 1-0-1 bis einschließlich 13.09. (Gesamttherapiedauer 10 Tage).
– Stationäre Wiederaufnahme am 28.09. zur Ureterorenoskopie mit Steinbergung und DJ-Entfernung am 29.09. Der DJ-Katheter darf nicht länger als 3 Monate verbleiben.
– Trinkmenge 2,5–3 l pro Tag.
– DJ-bedingte Beschwerden (Harndrang, Flankenschmerz beim Wasserlassen, leichte Hämaturie) sind möglich. Analgesie bei Bedarf mit Metamizol.
– Nach Steinbergung Steinanalyse und Metaphylaxe-Beratung.
– Bei erneutem Fieber, Schüttelfrost oder zunehmenden Schmerzen bitte sofortige Vorstellung.`},
med:[['Cefpodoxim','200 mg','1-0-1-0','bis einschl. 13.09.','neu'],['Metamizol','500 mg','bei Bedarf bis 2-2-2-2','','neu']],
check:['Infizierter Harnstau als Notfall erkannt','Steingröße und Lokalisation','Entlastung mit Art und Datum','Begründung: keine Steinsanierung im Infekt','Kulturen mit Resistogramm','Antibiose antibiogrammgerecht mit Enddatum','Termin für definitive Steinsanierung','Hinweis zur maximalen DJ-Liegedauer','Trinkmenge und Metaphylaxe'],
fallen:['DJ ohne Wechsel-/Entfernungstermin: vergessene Stents verkrusten.','Steinsanierung im akuten Infekt: Sepsisrisiko.','Resistenzen nicht erwähnt: Hausarzt verordnet Cotrimoxazol bei Rezidiv.']}
];

{id:'aa',name:'A-a-Gradient',cat:'Pneumologie & Intensiv',tags:'bga sauerstoff lunge',desc:'Alveolo-arterielle Sauerstoffdifferenz zur Unterscheidung von Hypoventilation und Diffusions- oder Shuntstörung.',

{id:'egfr',name:'eGFR (CKD-EPI 2021)',cat:'Niere & Elektrolyte',tags:'niere kreatinin gfr ckd',desc:'Geschätzte GFR nach CKD-EPI 2021, ohne Ethnie-Faktor. Einheit ml/min/1,73 m².',

compute:v=>{let cr=num(v.cr);if(v.cr_u==='umol')cr=cr/88.4;const age=num(v.age);if(!(cr>0&&age>0))return null;const f=v.sex==='w';const k=f?0.7:0.9,a=f?-0.241:-0.302;let e=142*Math.pow(Math.min(cr/k,1),a)*Math.pow(Math.max(cr/k,1),-1.2)*Math.pow(0.9938,age);if(f)e*=1.012;const st=e>=90?'G1':e>=60?'G2':e>=45?'G3a':e>=30?'G3b':e>=15?'G4':'G5';return{main:[r0(e),'ml/min/1,73 m²','eGFR'],lines:[['KDIGO-Stadium',st],['Kreatinin',r1(cr,2)+' mg/dl']],lv:e<30?'crit':e<60?'warn':'ok',tx:e<30?'Schwer eingeschränkt: Dosisanpassung renal eliminierter Medikamente prüfen, Nephrologie einbinden.':e<60?'Mittelgradig eingeschränkt: Medikation auf renale Dosisanpassung prüfen (z. B. Metformin, DOAK, Gabapentin).':'Normal bis leicht eingeschränkt (Stadium nur zusammen mit Albuminurie aussagekräftig).'}},ref:'Inker et al., NEJM 2021'},
{id:'cg',name:'Kreatinin-Clearance (Cockcroft-Gault)',cat:'Niere & Elektrolyte',tags:'niere dosierung doak clearance',desc:'Viele Fachinformationen (z. B. DOAK) beziehen sich auf die Cockcroft-Gault-Clearance, nicht auf die eGFR.',

{id:'na_corr',name:'Korrigiertes Natrium bei Hyperglykämie',cat:'Niere & Elektrolyte',tags:'natrium glukose dka hyperglykämie',desc:'Bei Hyperglykämie ist das gemessene Natrium durch Wasserverschiebung erniedrigt (Pseudohyponatriämie im weiteren Sinn).',

{id:'ca_corr',name:'Albumin-korrigiertes Calcium',cat:'Niere & Elektrolyte',tags:'calcium kalzium albumin',desc:'Schätzt das Gesamtcalcium bei Hypalbuminämie. Im Zweifel ionisiertes Calcium messen.',

{id:'osm',name:'Serumosmolalität & osmotische Lücke',cat:'Niere & Elektrolyte',tags:'osmolalität intoxikation methanol ethylenglykol',desc:'Berechnete Osmolalität. Eine osmotische Lücke > 10 mosm/kg deutet auf zusätzliche osmotisch wirksame Substanzen (Alkohole, Mannitol) hin.',

{id:'meld',name:'MELD / MELD-Na',cat:'Gastro & Leber',tags:'leber transplantation zirrhose',desc:'Prognose bei Lebererkrankung im Endstadium und Transplantations-Allokation.',
type:'formula',inputs:[{id:'bili',l:'Bilirubin',u:'mg/dl',d:2.4},{id:'inr',l:'INR',u:'',d:1.6},{id:'cr',l:'Kreatinin',u:'mg/dl',d:1.2},{id:'na',l:'Natrium',u:'mmol/l',d:132},{id:'dia',l:'Dialyse ≥ 2x in der letzten Woche',o:[['0','nein'],['1','ja']],d:'0'}],
compute:v=>{let b=num(v.bili),i=num(v.inr),c=num(v.cr),na=num(v.na);if(![b,i,c].every(x=>x>0))return null;b=Math.max(b,1);i=Math.max(i,1);c=Math.max(c,1);if(v.dia==='1'||c>4)c=4;let m=10*(0.957*Math.log(c)+0.378*Math.log(b)+1.12*Math.log(i)+0.643);m=Math.round(m*10)/10;let mn=m;if(Number.isFinite(na)&&m>11){const n=Math.min(Math.max(na,125),137);mn=m+1.32*(137-n)-0.033*m*(137-n)}const s=Math.round(mn);const mort=s<10?'1,9':s<20?'6,0':s<30?'19,6':s<40?'52,6':'71,3';return{main:[s,'Punkte','MELD-Na'],lines:[['MELD (klassisch)',Math.round(m)],['3-Monats-Mortalität ca.',mort+' %']],lv:s>=20?'crit':s>=10?'warn':'ok',tx:s>=15?'MELD ≥ 15: Evaluation zur Lebertransplantation erwägen.':'Engmaschige hepatologische Anbindung.'}},ref:'Kamath 2001; Kim et al., NEJM 2008'},
{id:'gbs',name:'Glasgow-Blatchford-Score',cat:'Gastro & Leber',tags:'gi blutung obere teerstuhl meläna',desc:'Risikoabschätzung bei oberer GI-Blutung vor Endoskopie. Score ≤ 1: ambulante Abklärung möglich.',
type:'score',items:[
{id:'u',l:'Harnstoff',o:[['< 6,5 mmol/l (< 39 mg/dl)',0],['6,5–7,9 mmol/l (39–47 mg/dl)',2],['8–9,9 mmol/l (48–59 mg/dl)',3],['10–24,9 mmol/l (60–149 mg/dl)',4],['≥ 25 mmol/l (≥ 150 mg/dl)',6]]},
{id:'hb',l:'Hämoglobin',o:[['Männer ≥ 13 / Frauen ≥ 12 g/dl',0],['Männer 12–12,9 g/dl',1],['Männer 10–11,9 g/dl',3],['Frauen 10–11,9 g/dl',1],['< 10 g/dl',6]]},
{id:'s',l:'RR systolisch',o:[['≥ 110 mmHg',0],['100–109 mmHg',1],['90–99 mmHg',2],['< 90 mmHg',3]]},
{id:'hf',l:'Herzfrequenz ≥ 100/min',p:1},{id:'m',l:'Meläna',p:1},{id:'sy',l:'Synkope',p:2},{id:'le',l:'Lebererkrankung',p:2},{id:'hi',l:'Herzinsuffizienz',p:2}],
interpret:t=>t<=1?{lv:'ok',tx:'≤ 1: niedriges Risiko, ambulante Endoskopie möglich.'}:t<=7?{lv:'warn',tx:'Stationäre Aufnahme, Endoskopie innerhalb von 24 h.'}:{lv:'crit',tx:'Hohes Risiko für Interventionsbedarf: Stabilisierung, Endoskopie innerhalb von 24 h (bei Instabilität früher).'},ref:'Blatchford et al., Lancet 2000; ESGE 2021'},

{id:'wells_tvt',name:'Wells-Score TVT',cat:'Notaufnahme & Chirurgie',tags:'thrombose tvt bein d-dimer',desc:'Klinische Wahrscheinlichkeit einer tiefen Beinvenenthrombose.',
type:'score',items:[{id:'1',l:'Aktive Krebserkrankung',p:1},{id:'2',l:'Lähmung oder kürzliche Immobilisation des Beins (Gips)',p:1},{id:'3',l:'Bettlägerigkeit > 3 Tage oder große OP < 12 Wochen',p:1},{id:'4',l:'Schmerz / Verhärtung entlang der tiefen Venen',p:1},{id:'5',l:'Schwellung des gesamten Beins',p:1},{id:'6',l:'Unterschenkelschwellung > 3 cm gegenüber Gegenseite',p:1},{id:'7',l:'Eindrückbares Ödem am symptomatischen Bein',p:1},{id:'8',l:'Sichtbare oberflächliche Kollateralvenen',p:1},{id:'9',l:'Frühere dokumentierte TVT',p:1},{id:'10',l:'Alternative Diagnose mindestens ebenso wahrscheinlich',p:-2}],

{id:'centor',name:'Centor / McIsaac',cat:'Notaufnahme & Chirurgie',tags:'tonsillitis halsschmerz streptokokken angina',desc:'Wahrscheinlichkeit einer Streptokokken-Tonsillopharyngitis.',
type:'score',items:[{id:'t',l:'Fieber > 38 °C',p:1},{id:'c',l:'Kein Husten',p:1},{id:'l',l:'Geschwollene, druckschmerzhafte vordere Halslymphknoten',p:1},{id:'e',l:'Tonsillenschwellung oder -exsudat',p:1},{id:'a',l:'Alter',o:[['15–44 Jahre',0],['3–14 Jahre',1],['≥ 45 Jahre',-1]]}],

{id:'parkland',name:'Parkland (Verbrennung)',cat:'Notaufnahme & Chirurgie',tags:'verbrennung volumen infusion',desc:'Volumenbedarf in den ersten 24 h. Nur zweit- und drittgradige Areale zählen. Steuerung nach Urinausscheidung (0,5 ml/kg/h).',
type:'formula',inputs:[{id:'kg',l:'Gewicht',u:'kg',d:80},{id:'vkof',l:'Verbrannte KOF (2.–3. Grad)',u:'%',d:30},{id:'f',l:'Formel',o:[['4','Parkland 4 ml/kg/%'],['2','Modifiziert 2 ml/kg/% (Erw.)']],d:'4'}],
compute:v=>{const kg=num(v.kg),p=num(v.vkof),f=num(v.f);if(!(kg>0&&p>0))return null;const tot=f*kg*p;return{main:[r0(tot),'ml / 24 h','Kristalloide'],lines:[['Erste 8 h',r0(tot/2)+' ml ('+r0(tot/2/8)+' ml/h)'],['Folgende 16 h',r0(tot/2)+' ml ('+r0(tot/2/16)+' ml/h)']],lv:p>=20?'warn':'info',tx:'Zeitpunkt 0 ist der Unfallzeitpunkt, nicht die Ankunft. Neunerregel: Kopf 9 %, Arm je 9 %, Rumpf vorn/hinten je 18 %, Bein je 18 %, Genitale 1 %.'}},ref:'Baxter 1968; S2k-Leitlinie Thermische Verletzungen'},

{id:'4at',name:'4AT (Delir-Screening)',cat:'Geriatrie',tags:'delir verwirrtheit postoperativ',desc:'Schnelltest auf Delir, in unter 2 Minuten durchführbar, keine Schulung nötig.',

{id:'naegele',name:'Geburtstermin & SSW',cat:'Pädiatrie & Gyn',tags:'schwangerschaft et ssw naegele',desc:'Errechneter Termin nach erweiterter Naegele-Regel und aktuelle Schwangerschaftswoche. Eine frühe Ultraschall-Datierung hat Vorrang.',
type:'formula',inputs:[{id:'lp',l:'Erster Tag der letzten Periode',t:'date',d:'__LP__'},{id:'zyk',l:'Zykluslänge',u:'Tage',d:28}],
compute:v=>{if(!v.lp)return null;const lp=new Date(v.lp+'T12:00:00');const z=num(v.zyk)||28;if(isNaN(lp))return null;const et=new Date(lp.getTime()+(280+z-28)*864e5);const now=new Date();now.setHours(12,0,0,0);const days=Math.floor((now-lp)/864e5)-(z-28);const w=Math.floor(days/7),d=days%7;const fmt=x=>x.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});return{main:[days>=0?`${w}+${d}`:'–','SSW','heute'],lines:[['Errechneter Termin',fmt(et)],['Tage bis ET',r0((et-now)/864e5)],['Trimenon',days<98?'1.':days<196?'2.':'3.']],lv:'info',tx:'ET = LP + 280 Tage + (Zykluslänge − 28).'}},ref:'Erweiterte Naegele-Regel'},

{id:'perfusor',name:'Perfusor-Laufrate',cat:'Dosierung & Perfusor',tags:'perfusor spritzenpumpe noradrenalin katecholamine heparin laufrate',desc:'Umrechnung der Zieldosis in ml/h. Standardkonzentrationen sind hausabhängig, bitte mit der eigenen Perfusorliste abgleichen.',
type:'formula',inputs:[{id:'pre',l:'Vorlage',o:[['nor','Noradrenalin 5 mg / 50 ml'],['hep','Heparin 25.000 IE / 50 ml'],['furo','Furosemid 250 mg / 50 ml'],['prop','Propofol 2 % (1000 mg / 50 ml)'],['frei','Eigene Konzentration']],d:'nor'},{id:'dose',l:'Dosis',u:'',d:0.1,uo:[['ugkgmin','µg/kg/min'],['mgkgh','mg/kg/h'],['mgh','mg/h'],['ieh','IE/h']],du:'ugkgmin'},{id:'kg',l:'Gewicht',u:'kg',d:75},{id:'amt',l:'Wirkstoffmenge in Spritze',u:'mg bzw. IE',d:5},{id:'vol',l:'Volumen',u:'ml',d:50}],
presets:{nor:{amt:5,vol:50,dose:0.1,dose_u:'ugkgmin'},hep:{amt:25000,vol:50,dose:1000,dose_u:'ieh'},furo:{amt:250,vol:50,dose:10,dose_u:'mgh'},prop:{amt:1000,vol:50,dose:2,dose_u:'mgkgh'}},
compute:v=>{const d=num(v.dose),kg=num(v.kg),a=num(v.amt),vol=num(v.vol);if(!(d>=0&&a>0&&vol>0))return null;const c=a/vol;let perh;const u=v.dose_u||'ugkgmin';if(u==='ugkgmin'){if(!(kg>0))return null;perh=d*kg*60/1000}else if(u==='mgkgh'){if(!(kg>0))return null;perh=d*kg}else perh=d;const ml=perh/c;return{main:[r1(ml,1),'ml/h','Laufrate'],lines:[['Konzentration',r1(c,c<1?3:1)+(u==='ieh'?' IE/ml':' mg/ml')],['Dosis pro Stunde',r1(perh,perh<1?3:1)+(u==='ieh'?' IE/h':' mg/h')],['Spritze reicht für',r1(vol/ml,1)+' h']],lv:'info',tx:'Vor Anschluss immer Vier-Augen-Prinzip: Wirkstoff, Konzentration, Laufrate, Patient.'}},ref:'Hausinterne Perfusorstandards haben Vorrang'},
{id:'mgkg',name:'Dosis nach Körpergewicht',cat:'Dosierung & Perfusor',tags:'dosierung kinder mg kg saft',desc:'Einzel- und Tagesdosis nach mg/kg mit optionaler Umrechnung in ml (z. B. Saft).',
type:'formula',inputs:[{id:'mgkg',l:'Dosis',u:'mg/kg pro Gabe',d:15},{id:'kg',l:'Gewicht',u:'kg',d:18},{id:'n',l:'Gaben pro Tag',u:'x',d:4},{id:'max',l:'Maximale Einzeldosis (optional)',u:'mg',d:1000},{id:'konz',l:'Konzentration (optional)',u:'mg/ml',d:40}],
compute:v=>{const d=num(v.mgkg),kg=num(v.kg),n=num(v.n)||1,mx=num(v.max),k=num(v.konz);if(!(d>0&&kg>0))return null;let e=d*kg;let capped=false;if(mx>0&&e>mx){e=mx;capped=true}const lines=[['Tagesdosis',r0(e*n)+' mg'],['Gaben',n+' × täglich']];if(k>0)lines.unshift(['Volumen pro Gabe',r1(e/k,1)+' ml']);return{main:[r0(e),'mg','pro Gabe'],lines,lv:capped?'warn':'info',tx:capped?'Auf die maximale Einzeldosis begrenzt.':'Beispiel: Paracetamol-Saft 40 mg/ml, 15 mg/kg, max. 60 mg/kg/Tag.'}},ref:'Immer mit Fachinformation und Kinderdosierungs-Referenz abgleichen'},

compute:v=>{const vol=num(v.vol),h=num(v.h),tr=num(v.tr);if(!(vol>0&&h>0&&tr>0))return null;const mlh=vol/h;return{main:[r0(mlh*tr/60),'Trpf/min',''],lines:[['Laufrate',r0(mlh)+' ml/h'],['Sekunden pro Tropfen',r1(3600/(mlh*tr),1)+' s']],lv:'info',tx:'Faustregel bei 20 Trpf/ml: ml/h ÷ 3 = Tropfen/min.'}},ref:''},

{id:'bmi',name:'BMI, KOF & Idealgewicht',cat:'Allgemein',tags:'bmi körperoberfläche gewicht kof adipositas',desc:'Body-Mass-Index (WHO), Körperoberfläche nach Mosteller und Idealgewicht nach Devine (z. B. für Beatmung, Dosierung).',
type:'formula',inputs:[{id:'cm',l:'Größe',u:'cm',d:178},{id:'kg',l:'Gewicht',u:'kg',d:82},{id:'sex',l:'Geschlecht',o:[['m','männlich'],['w','weiblich']],d:'m'}],
compute:v=>{const cm=num(v.cm),kg=num(v.kg);if(!(cm>0&&kg>0))return null;const b=kg/Math.pow(cm/100,2);const kof=Math.sqrt(cm*kg/3600);const ibw=(v.sex==='w'?45.5:50)+0.91*(cm-152.4);const cls=b<18.5?'Untergewicht':b<25?'Normalgewicht':b<30?'Präadipositas':b<35?'Adipositas Grad I':b<40?'Adipositas Grad II':'Adipositas Grad III';return{main:[r1(b,1),'kg/m²','BMI'],lines:[['WHO-Klasse',cls],['KOF (Mosteller)',r1(kof,2)+' m²'],['Idealgewicht (Devine)',r1(ibw,1)+' kg'],['Tidalvolumen 6 ml/kg IBW',r0(ibw*6)+' ml']],lv:b<18.5||b>=30?'warn':'ok',tx:cls+'.'}},ref:'WHO; Mosteller 1987; Devine 1974'},
{id:'bga',name:'BGA-Interpretation',cat:'Allgemein',tags:'blutgas säure base azidose alkalose anionenlücke',desc:'Schrittweise Analyse von Säure-Basen-Störungen mit Kompensation, Anionenlücke (albuminkorrigiert) und Delta-Ratio.',
type:'formula',inputs:[{id:'ph',l:'pH',u:'',d:7.28},{id:'pco2',l:'pCO₂',u:'mmHg',d:28},{id:'hco3',l:'HCO₃⁻',u:'mmol/l',d:13},{id:'na',l:'Natrium',u:'mmol/l',d:138},{id:'cl',l:'Chlorid',u:'mmol/l',d:100},{id:'alb',l:'Albumin',u:'g/l',d:40},{id:'chr',l:'Respiratorische Störung',o:[['a','akut'],['c','chronisch']],d:'a'}],
compute:v=>{const ph=num(v.ph),pc=num(v.pco2),h=num(v.hco3),na=num(v.na),cl=num(v.cl),alb=num(v.alb);if(![ph,pc,h].every(Number.isFinite))return null;const steps=[];let prim='',lv='ok';
if(ph<7.35){steps.push(['Azidämie (pH '+r1(ph,2)+').']);lv='warn';if(h<22){prim='met-azi';}else if(pc>45){prim='resp-azi';}}
else if(ph>7.45){steps.push(['Alkalämie (pH '+r1(ph,2)+').']);lv='warn';if(h>26){prim='met-alk';}else if(pc<35){prim='resp-alk';}}
else{steps.push(['pH im Normbereich.']);if(h<22&&pc<35){prim='mixed';steps.push(['HCO₃⁻ und pCO₂ beide erniedrigt bei normalem pH: gemischte metabolische Azidose und respiratorische Alkalose möglich.']);lv='warn'}else if(h>26&&pc>45){prim='mixed';steps.push(['HCO₃⁻ und pCO₂ beide erhöht bei normalem pH: gemischte metabolische Alkalose und respiratorische Azidose möglich.']);lv='warn'}else steps.push(['Keine primäre Säure-Basen-Störung erkennbar.'])}
if(prim==='met-azi'){const e=1.5*h+8;steps.push([`Primär metabolische Azidose. Erwarteter pCO₂ (Winters): ${r1(e,0)} ± 2 mmHg.`]);if(pc>e+2)steps.push(['pCO₂ höher als erwartet: zusätzliche respiratorische Azidose.']);else if(pc<e-2)steps.push(['pCO₂ niedriger als erwartet: zusätzliche respiratorische Alkalose.']);else steps.push(['Respiratorisch adäquat kompensiert.']);if(ph<7.2)lv='crit'}
if(prim==='resp-azi'){const acute=v.chr!=='c';const e=24+(pc-40)/10*(acute?1:3.5);steps.push([`Primär respiratorische Azidose (${acute?'akut':'chronisch'}). Erwartetes HCO₃⁻: ${r1(e,0)} mmol/l.`]);if(h>e+2)steps.push(['HCO₃⁻ höher als erwartet: zusätzliche metabolische Alkalose.']);else if(h<e-2)steps.push(['HCO₃⁻ niedriger als erwartet: zusätzliche metabolische Azidose.']);else steps.push(['Metabolisch erwartungsgemäß kompensiert.']);if(ph<7.2)lv='crit'}
if(prim==='met-alk'){const e=40+0.7*(h-24);steps.push([`Primär metabolische Alkalose. Erwarteter pCO₂: ${r1(e,0)} ± 2 mmHg.`]);if(pc>e+2)steps.push(['pCO₂ höher als erwartet: zusätzliche respiratorische Azidose.']);else if(pc<e-2)steps.push(['pCO₂ niedriger als erwartet: zusätzliche respiratorische Alkalose.']);else steps.push(['Respiratorisch adäquat kompensiert.']);steps.push(['Urin-Chlorid hilft: < 20 mmol/l chloridsensibel (Erbrechen, Diuretika), > 20 mmol/l chloridresistent (Hyperaldosteronismus).'])}
if(prim==='resp-alk'){const acute=v.chr!=='c';const e=24-(40-pc)/10*(acute?2:5);steps.push([`Primär respiratorische Alkalose (${acute?'akut':'chronisch'}). Erwartetes HCO₃⁻: ${r1(e,0)} mmol/l.`]);if(h>e+2)steps.push(['HCO₃⁻ höher als erwartet: zusätzliche metabolische Alkalose.']);else if(h<e-2)steps.push(['HCO₃⁻ niedriger als erwartet: zusätzliche metabolische Azidose.']);else steps.push(['Metabolisch erwartungsgemäß kompensiert.'])}
const lines=[];if([na,cl].every(Number.isFinite)){const ag=na-(cl+h);const agc=Number.isFinite(alb)?ag+0.25*(40-alb):ag;lines.push(['Anionenlücke',r1(ag,0)+' mmol/l']);lines.push(['AL albuminkorrigiert',r1(agc,0)+' mmol/l']);if(prim==='met-azi'||(prim==='mixed'&&h<22)){if(agc>12){steps.push([`Anionenlücke erhöht (${r1(agc,0)}): Laktat, Ketoazidose, Urämie, Intoxikation (Methanol, Ethylenglykol, Salicylat).`]);const dr=(agc-12)/(24-h);lines.push(['Delta-Ratio',r1(dr,2)]);steps.push([dr<0.4?'Delta-Ratio < 0,4: überwiegend hyperchlorämische Azidose.':dr<0.8?'Delta-Ratio 0,4–0,8: kombinierte Azidose mit normaler und erhöhter Anionenlücke.':dr<=2?'Delta-Ratio 0,8–2: reine Azidose mit erhöhter Anionenlücke.':'Delta-Ratio > 2: zusätzliche metabolische Alkalose oder vorbestehend erhöhtes HCO₃⁻.'])}else steps.push(['Anionenlücke normal: hyperchlorämische Azidose (Diarrhö, renal-tubuläre Azidose, NaCl-Infusion).'])}}
return{main:[prim?{"met-azi":'Met. Azidose',"resp-azi":'Resp. Azidose',"met-alk":'Met. Alkalose',"resp-alk":'Resp. Alkalose',mixed:'Gemischt'}[prim]:'Normal','',''],lines,steps,lv,tx:''}},ref:'Normwerte: pH 7,35–7,45; pCO₂ 35–45 mmHg; HCO₃⁻ 22–26 mmol/l; AL 8–12 mmol/l'},

let IDX=null,resList=[],hl=0;
function doSearch(q){
 const box=$('#gres');if(!box)return;q=q.trim().toLowerCase();
 if(!q){box.hidden=true;return}
 IDX=IDX||searchIndex();
 const terms=q.split(/\s+/);
 resList=IDX.filter(x=>terms.every(t=>x.s.includes(t))).slice(0,12);hl=0;
 box.innerHTML=resList.length?resList.map((x,i)=>`<button data-res="${i}" class="${i===0?'hl':''}"><span>${esc(x.t)}</span><span class="k">${esc(x.k)}</span></button>`).join(''):'<div class="empty">Nichts gefunden</div>';
 box.hidden=false;
}

   if(inp.o)return `<div class="field"><label for="${id}">${esc(inp.l)}</label><select class="input" id="${id}" data-ci="${inp.id}">${inp.o.map(o=>`<option value="${o[0]}" ${String(v[inp.id])===String(o[0])?'selected':''}>${esc(o[1])}</option>`).join('')}</select></div>`;
   if(inp.t==='date')return `<div class="field"><label for="${id}">${esc(inp.l)}</label><input class="input" type="date" id="${id}" data-ci="${inp.id}" value="${esc(v[inp.id])}"></div>`;
   const unit=inp.uo?`<select id="${id}-u" data-ci="${inp.id}_u" aria-label="Einheit">${inp.uo.map(o=>`<option value="${o[0]}" ${v[inp.id+'_u']===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`:inp.u?`<span>${esc(inp.u)}</span>`:'';
   return `<div class="field"><label for="${id}">${esc(inp.l)}</label><div class="unit"><input class="input mono" id="${id}" inputmode="decimal" data-ci="${inp.id}" value="${esc(String(v[inp.id]).replace('.',','))}" ${unit?'':'style="border-radius:var(--r-s)"'}>${unit}</div></div>`}).join('')}</div>`;
 }
 return `<button class="back only-m" data-calcback>${ic('back')}Alle Rechner</button>
 <div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:nowrap"><div><span class="eyebrow">${esc(c.cat)}</span><h2 style="margin-top:4px">${esc(c.name)}</h2><p class="muted" style="margin-top:6px;max-width:68ch">${esc(c.desc)}</p></div><button class="star" data-fav="${c.id}" aria-pressed="${fav}" aria-label="${fav?'Aus Favoriten entfernen':'Zu Favoriten'}">${ic('star','style="width:22px;height:22px"')}</button></div>
 <div class="calc-body"><div>${inputs}${c.type==='score'?`<div class="row" style="margin-top:12px"><button class="btn ghost sm" data-calcreset="${c.id}">Zurücksetzen</button></div>`:''}</div><div class="result" id="cres" aria-live="polite"></div></div>`;
}
function updateCalcResult(){
 const c=CALCS.find(x=>x.id===S.calcId);const box=$('#cres');if(!c||!box)return;const v=calcVals[c.id]||initVals(c);
 let html='';
 if(c.type==='score'){
  let t=0;c.items.forEach(it=>{if(it.o)t+=it.o[+v[it.id]||0][1];else if(v[it.id])t+=it.p});
  const r=c.interpret(t,v)||{};const disp=Number.isInteger(t)?t:r1(t,1);
  html=`<div><span class="eyebrow">Punkte</span><div class="big">${disp}</div></div>${r.extra?`<div class="lines">${r.extra.map(e=>`<div class="line"><span>${esc(e[0])}</span><b>${esc(e[1])}</b></div>`).join('')}</div>`:''}<div class="verdict ${r.lv||'info'}">${esc(r.tx||'')}</div>`;
 }else{
  let r=null;try{r=c.compute(v)}catch(e){r=null}
  if(!r)html='<p class="faint">Bitte alle Pflichtfelder ausfüllen.</p>';
  else html=`<div><span class="eyebrow">${esc(r.main[2]||'Ergebnis')}</span><div class="big ${/^[\d.,+\-–]+$/.test(String(r.main[0]))?'':'txt'}">${esc(r.main[0])}<small>${esc(r.main[1])}</small></div></div>${r.lines&&r.lines.length?`<div class="lines">${r.lines.map(e=>`<div class="line"><span>${esc(e[0])}</span><b>${esc(e[1])}</b></div>`).join('')}</div>`:''}${r.steps?`<div class="bga-steps">${r.steps.map((s,i)=>`<div><i>${i+1}</i><span>${esc(s[0])}</span></div>`).join('')}</div>`:''}${r.tx?`<div class="verdict ${r.lv||'info'}">${esc(r.tx)}</div>`:''}`;
 }
 box.innerHTML=html+(c.ref?`<p class="ref">${esc(c.ref)}</p>`:'');
}

/* ================= KITTELTASCHE ================= */

 const tabs=[['notfall','Notfall'],['labor','Labor'],['ku','Untersuchung'],['ueb','Übergabe & Visite'],['abk','Abkürzungen']];

  <div class="ref-grid">${EMERG.map(e=>`<section class="panel rcard"><h3>${esc(e.t)}${e.tag?`<span class="tag">${esc(e.tag)}</span>`:''}</h3><div class="tw"><table class="medtab"><tbody>${e.items.map(i=>`<tr><td><b>${esc(i[0])}</b><div class="faint" style="font-size:12.5px">${esc(i[2])}</div></td><td class="mono" style="white-space:normal">${esc(i[1])}</td></tr>`).join('')}</tbody></table></div></section>`).join('')}</div>`;
 }else if(S.refTab==='labor'){
  const cats=['Alle',...new Set(LABS.map(l=>l[0]))];const q=S.labQ.toLowerCase();
  const rows=LABS.filter(l=>(S.labCat==='Alle'||l[0]===S.labCat)&&(!q||(l[1]+' '+l[0]+' '+l[4]).toLowerCase().includes(q)));
  b=`<div class="row" style="margin-bottom:12px"><input class="input" id="labq" type="search" placeholder="Wert suchen …" value="${esc(S.labQ)}" style="max-width:300px" aria-label="Laborwert suchen"></div>
  <div class="chips" style="margin-bottom:14px">${cats.map(c=>`<button class="chip" data-labcat="${esc(c)}" aria-pressed="${S.labCat===c}">${esc(c)}</button>`).join('')}</div>
  <div class="panel tw"><table class="tbl"><thead><tr><th>Parameter</th><th>Referenz</th><th>Einheit</th><th>Hinweis</th></tr></thead><tbody>${rows.map(l=>`<tr><td><b>${esc(l[1])}</b><div class="faint" style="font-size:12px">${esc(l[0])}</div></td><td class="mono">${esc(l[2])}</td><td class="mono">${esc(l[3])}</td><td class="muted">${esc(l[4])}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Kein Treffer</td></tr>'}</tbody></table></div>
  <p class="faint" style="font-size:12.5px;margin-top:10px">Typische Referenzbereiche für Erwachsene. Maßgeblich sind die Referenzwerte des jeweiligen Labors.</p>`;
 }else if(S.refTab==='ku'){
  b=`<div class="row" style="margin-bottom:14px;justify-content:space-between"><p class="muted" style="max-width:62ch">Unauffällige Untersuchungsbefunde als Textbausteine. Kopieren und Pathologisches gezielt ersetzen.</p><button class="btn" data-copyall-ku>${ic('copy')}Alle kopieren</button></div>
  <div class="ref-grid">${EXAM.map(e=>`<section class="panel rcard"><h3>${esc(e.t)}</h3><div class="copyblock"><p>${esc(e.x)}</p><button class="btn sm" data-copy="${esc(e.x)}">${ic('copy')}Kopieren</button></div></section>`).join('')}</div>`;
 }else if(S.refTab==='ueb'){
  b=`<div class="ref-grid">${HANDOVER.map(h=>`<section class="panel rcard"><h3>${esc(h.t)}</h3><div class="stack" style="gap:10px">${h.steps.map(s=>`<div style="display:grid;grid-template-columns:28px 1fr;gap:10px"><span class="mono" style="color:var(--accent);font-size:18px;font-weight:500">${esc(s[0])}</span><div><b>${esc(s[1])}</b><p class="muted" style="font-size:13.5px">${esc(s[2])}</p></div></div>`).join('')}</div></section>`).join('')}
  <section class="panel rcard"><h3>Checkliste Neuaufnahme</h3><div class="check">${ADMIT.map((a,i)=>`<label><input type="checkbox" id="adm-${i}"><span>${esc(a)}</span></label>`).join('')}</div></section></div>`;
 }else{
  const q=S.abbrQ.toLowerCase();const rows=ABBR.filter(a=>!q||(a[0]+' '+a[1]).toLowerCase().includes(q));
  b=`<input class="input" id="abbrq" type="search" placeholder="Abkürzung suchen …" value="${esc(S.abbrQ)}" style="max-width:300px;margin-bottom:12px" aria-label="Abkürzung suchen">
  <div class="panel tw"><table class="tbl"><thead><tr><th style="width:30%">Abkürzung</th><th>Bedeutung</th></tr></thead><tbody>${rows.map(a=>`<tr><td class="mono"><b>${esc(a[0])}</b></td><td>${esc(a[1])}</td></tr>`).join('')||'<tr><td colspan="2" class="empty">Kein Treffer</td></tr>'}</tbody></table></div>`;
 }
 return `<div class="page-head"><div><h1>Kitteltasche</h1><p>Was du auf Station schnell brauchst: Notfalldosen, Normwerte, Normalbefunde, Übergabe.</p></div><div class="seg" role="group">${tabs.map(([k,t])=>`<button data-rtab="${k}" aria-pressed="${S.refTab===k}">${t}</button>`).join('')}</div></div>${b}`;
}

/* ================= TUTOR ================= */
const TUTOR_RULES=`Du bist ein erfahrener klinischer Tutor (Facharzt/Fachärztin) für Medizinstudierende im klinischen Abschnitt und PJ an einer deutschen Universitätsklinik. Antworte auf Deutsch, direkt und präzise, ohne Füllsätze. Orientiere dich an aktuellen deutschen und europäischen Leitlinien (AWMF, ESC, ERC, DGIM) und nenne sie, wenn relevant. Bei Dosierungen immer kurz auf Prüfung gegen Fachinformation bzw. Klinik-SOP hinweisen. Wenn der Nutzer einen Fall üben möchte, spiele den Fall schrittweise wie in einer echten Aufnahme: gib Informationen nur auf Nachfrage, lass den Nutzer Diagnostik und Therapie vorschlagen und gib am Ende strukturiertes Feedback. Bei Fragen zur Fallvorstellung oder zum Arztbrief gib konkrete Formulierungsbeispiele. Nutze Aufzählungen nur, wenn sie wirklich helfen. Keine Markdown-Überschriften. Es werden keine echten Patientendaten verwendet.`;
const TUTOR_STARTERS=['Spiel mit mir einen Fall in der Notaufnahme: Brustschmerz','Wie stelle ich einen Patienten auf der Visite in 60 Sekunden vor?','Erklär mir die Stufentherapie der Hyperkaliämie','Was gehört in eine gute Epikrise? Zeig ein Beispiel','Frag mich 5 Prüfungsfragen zur Pneumonie','Wie dokumentiere ich Suizidalität richtig?'];
function vTutor(){
 return `<div class="page-head"><div><h1>KI-Tutor</h1><p>Frag klinisch nach, übe Fälle oder lass dir Fallvorstellungen korrigieren.</p></div>${chat.length?`<button class="btn ghost" data-clearchat>${ic('trash')}Neuer Chat</button>`:''}</div>
 <p class="note ai-off-only" style="max-width:860px">Der Tutor braucht KI-Zugriff und ist in dieser Ansicht nicht verfügbar.</p>
 <div class="chat ai-only"><div class="msgs" id="msgs">${chat.length?chat.map(m=>`<div class="msg ${m.role==='user'?'u':'a'}">${m.role==='user'?esc(m.content):md(m.content)}</div>`).join(''):`<div class="stack" style="gap:10px;margin:auto 0"><span class="eyebrow">Vorschläge</span><div class="chips">${TUTOR_STARTERS.map(s=>`<button class="chip" data-starter="${esc(s)}">${esc(s)}</button>`).join('')}</div></div>`}</div>
 <div class="composer"><textarea class="input" id="chatin" rows="2" placeholder="Frage stellen … (Enter senden, Shift+Enter neue Zeile)"></textarea><button class="btn primary" id="chatsend" aria-label="Senden">${ic('send')}</button></div></div>`;
}
function scrollChat(){const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight}
let chatBusy=false;
async function sendChat(text){
 text=(text||'').trim();if(!text||chatBusy||!SAMPLE)return;chatBusy=true;
 chat.push({role:'user',content:text});render();
 const msgs=$('#msgs');const bubble=document.createElement('div');bubble.className='msg a';bubble.innerHTML='<span class="thinking"><i></i>denkt nach …</span>';msgs.appendChild(bubble);scrollChat();
 const turns=[{role:'user',content:TUTOR_RULES},...chat.slice(-16)];
 aiCtl=new AbortController();
 try{const r=await SAMPLE(turns,{cache:false,signal:aiCtl.signal,onText:({text})=>{bubble.innerHTML=md(text);scrollChat()}});chat.push({role:'assistant',content:r.text})}
 catch(e){if(e&&e.text)chat.push({role:'assistant',content:e.text+'\n\n(unterbrochen)'});else chat.push({role:'assistant',content:e&&e.code==='cancelled'?'(abgebrochen)':aiErr(e)})}
 finally{aiCtl=null;chatBusy=false;store.set('chat',chat.slice(-40));if(S.view==='tutor'){render();$('#chatin')&&$('#chatin').focus()}}
}

/* ================= Events ================= */
document.addEventListener('click',e=>{
 const t=e.target.closest('button,[data-res]');if(!t)return;const ds=t.dataset;
 if(ds.nav){if(ds.nav==='rechner')S.calcDetail=false;go(ds.nav);return}
 if(ds.res!=null){const r=resList[+ds.res];$('#gres').hidden=true;r&&r.go();return}
 if(ds.themeSet){const v=ds.themeSet;if(v==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',v);store.set('theme',v);setThemeBtns();return}
 if(ds.case){openCase(ds.case);return}
 if(ds.calc){go('rechner',{calcId:ds.calc,calcDetail:true});return}
 if(ds.ref){go('kitteltasche',{refTab:ds.ref});return}
 if(ds.fach){S.fach=ds.fach;render();return}
 if(ds.btab){S.briefTab=ds.btab;S.mode='write';render();return}
 if(ds.mode){S.mode=ds.mode;render();window.scrollTo(0,0);return}
 if(ds.psrc){S.paperSrc=ds.psrc;render();return}
 if(ds.rtab){S.refTab=ds.rtab;render();return}
 if(ds.labcat){S.labCat=ds.labcat;render();return}
 if(ds.copy!=null){copyText(ds.copy);return}
 if(ds.copyletter){const id=ds.copyletter;if(id==='__free')copyText(letterPlain(freeMeta,draftOf('__free')));else{const c=CASES.find(x=>x.id===id);const mine=S.paperSrc==='mine';copyText(letterPlain(metaOfCase(c),mine?draftOf(id):c.muster,mine?null:c.med))}return}
 if('copyallKu' in ds){copyText(EXAM.map(x=>x.t+': '+x.x).join('\n'));return}
 if(ds.phrase!=null){const ta=$(`textarea[data-sec="${ds.for}"]`);if(!ta)return;const p=ds.phrase;const s=ta.selectionStart??ta.value.length,en=ta.selectionEnd??ta.value.length;const useCursor=document.activeElement===ta||ta.dataset.lastFocus==='1';const pos=useCursor?s:ta.value.length;const pre=ta.value.slice(0,pos),post=ta.value.slice(useCursor?en:pos);const sep=pre&&!/\s$/.test(pre)?(p.startsWith('–')||p.endsWith(':')?'\n':' '):'';ta.value=pre+sep+p+post;ta.focus();const np=(pre+sep+p).length;ta.setSelectionRange(np,np);ta.dispatchEvent(new Event('input',{bubbles:true}));return}
 if(ds.markdone){const id=ds.markdone;statusMap[id]=statusMap[id]==='done'?'wip':'done';store.set('status',statusMap);render();toast(statusMap[id]==='done'?'Als fertig markiert':'Wieder offen');return}
 if(ds.aifb){runFeedback(ds.aifb);return}
 if('aistop' in ds){aiCtl&&aiCtl.abort();return}
 if('aidraft' in ds){runDraft();return}
 if('clearfree' in ds){if(!clearArmed){clearArmed=true;t.innerHTML=ic('trash')+'Wirklich leeren?';setTimeout(()=>{clearArmed=false;if(t.isConnected)t.innerHTML=ic('trash')+'Leeren'},3000);return}clearArmed=false;drafts.__free={};delete fbStore.__free;store.set('drafts',drafts);store.set('fb',fbStore);render();toast('Geleert');return}
 if(ds.fav){const id=ds.fav;favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];store.set('favs',favs);render();return}
 if('calcback' in ds){S.calcDetail=false;render();return}
 if(ds.calcreset){delete calcVals[ds.calcreset];render();return}
 if(ds.starter){sendChat(ds.starter);return}
 if(t.id==='chatsend'){const ta=$('#chatin');const v=ta.value;ta.value='';sendChat(v);return}
 if('clearchat' in ds){if(aiCtl)aiCtl.abort();chat=[];store.set('chat',chat);render();return}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='gsearch'){doSearch(t.value);return}
 if(t.dataset.sec){const id=S.view==='case'?S.caseId:'__free';draftOf(id)[t.dataset.sec]=t.value;saveDrafts();grow(t);const w=$(`[data-wc="${t.dataset.sec}"]`);if(w)w.textContent=wc(t.value);if(id!=='__free'&&!statusMap[id]&&t.value.trim()){statusMap[id]='wip';store.set('status',statusMap)}return}
 if(t.dataset.fm){freeMeta[t.dataset.fm]=t.value;store.set('free',freeMeta);if(t.tagName==='TEXTAREA')grow(t);return}
 if(t.dataset.ci!=null){const c=CALCS.find(x=>x.id===S.calcId);const v=calcVals[c.id];const k=t.dataset.ci;
  if(t.type==='checkbox'){v[k]=t.checked;t.closest('.sitem')&&t.closest('.sitem').classList.toggle('on',t.checked)}
  else if(c.type==='score'&&t.tagName==='SELECT')v[k]=+t.value;
  else v[k]=t.type==='date'||t.tagName==='SELECT'?t.value:t.value.replace(',','.');
  if(c.presets&&k==='pre'&&c.presets[t.value]){Object.assign(v,c.presets[t.value]);render();return}
  updateCalcResult();return}
 if(t.id==='calcq'){S.calcQ=t.value;const pos=t.selectionStart;render();const n=$('#calcq');n.focus();n.setSelectionRange(pos,pos);return}
 if(t.id==='labq'){S.labQ=t.value;const pos=t.selectionStart;render();const n=$('#labq');n.focus();n.setSelectionRange(pos,pos);return}
 if(t.id==='abbrq'){S.abbrQ=t.value;const pos=t.selectionStart;render();const n=$('#abbrq');n.focus();n.setSelectionRange(pos,pos);return}
 if(t.id==='chatin'){t.style.height='auto';t.style.height=Math.min(t.scrollHeight,180)+'px'}
});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.chk!=null){const id=S.caseId;const a=checks[id]||(checks[id]=[]);a[+t.dataset.chk]=t.checked;store.set('checks',checks);const h=t.closest('.rcard').querySelector('h3 .mono');if(h)h.textContent=a.filter(Boolean).length+'/'+CASES.find(c=>c.id===id).check.length}
});
document.addEventListener('focusin',e=>{if(e.target.dataset&&e.target.dataset.sec){$$('textarea[data-sec]').forEach(x=>x.dataset.lastFocus='');e.target.dataset.lastFocus='1'}});
document.addEventListener('keydown',e=>{
 const t=e.target;
 if(t.id==='gsearch'){const box=$('#gres');if(box.hidden)return;const bs=$$('button',box);if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();hl=(hl+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length;bs.forEach((b,i)=>b.classList.toggle('hl',i===hl))}else if(e.key==='Enter'){e.preventDefault();const r=resList[hl];box.hidden=true;t.value='';r&&r.go()}else if(e.key==='Escape'){box.hidden=true}}
 if(t.id==='chatin'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();const v=t.value;t.value='';sendChat(v)}
 if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(t.tagName)){e.preventDefault();$('#gsearch')&&$('#gsearch').focus()}
});
document.addEventListener('click',e=>{if(!e.target.closest('.search')){const b=$('#gres');if(b)b.hidden=true}},true);

/* ================= Boot ================= */
(function boot(){
 const th=store.get('theme','system');if(th==='light'||th==='dark')document.documentElement.setAttribute('data-theme',th);
 shell();
 const h=(location.hash||'').slice(1);if(['start','briefe','rechner','kitteltasche','tutor'].includes(h))S.view=h;
 render();
})();
