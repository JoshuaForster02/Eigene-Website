<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Kitteltasche: Arztbrief-Trainer mit 12 Fällen, 38 klinische Rechner und Nachschlagewerk für Station und Notaufnahme. Von Joshua Forster.">
<meta property="og:title" content="Kitteltasche · Klinikbegleiter">
<meta property="og:description" content="Arztbriefe schreiben lernen, klinische Scores rechnen, Notfalldosen und Normwerte nachschlagen.">
<meta property="og:url" content="https://joshuaforster.de/kitteltasche/">
<link rel="canonical" href="https://joshuaforster.de/kitteltasche/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Kitteltasche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface-2:#E8ECF0; --surface-3:#DDE3E9;
  --ink:#131D27; --ink-2:#4B5968; --ink-3:#7A8795; --line:#D3DAE1;
  --accent:#0D5A8C; --accent-ink:#FFFFFF; --accent-soft:#DBE9F3; --accent-strong:#093F63;
  --pulse:#C4302B; --pulse-soft:#F7DEDB;
  --ok:#23734A; --ok-soft:#D8EEDF; --warn:#9A6212; --warn-soft:#F6E8CF; --crit:#B7281F; --crit-soft:#F6DAD6;
  --paper:#FFFFFF; --paper-ink:#1A1F24; --paper-line:#E3E7EB;
  --shadow:0 1px 2px rgba(19,29,39,.06),0 4px 16px rgba(19,29,39,.06);
  --f-ui:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:"Bricolage Grotesque",var(--f-ui);
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --f-paper:"Source Serif 4",Georgia,"Times New Roman",serif;
  --r:10px; --r-s:6px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E141A; --surface:#151D25; --surface-2:#1C2630; --surface-3:#25313C;
    --ink:#E5EBF0; --ink-2:#9EABB8; --ink-3:#6F7D8B; --line:#29353F;
    --accent:#62AADB; --accent-ink:#06131C; --accent-soft:#15314A; --accent-strong:#9CCBEB;
    --pulse:#F06A5F; --pulse-soft:#3A1D1B;
    --ok:#5CC28C; --ok-soft:#15301F; --warn:#E2B252; --warn-soft:#352914; --crit:#F06A5F; --crit-soft:#3A1D1B;
    --paper:#1A232C; --paper-ink:#E3E8ED; --paper-line:#2B3742;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E141A; --surface:#151D25; --surface-2:#1C2630; --surface-3:#25313C;
  --ink:#E5EBF0; --ink-2:#9EABB8; --ink-3:#6F7D8B; --line:#29353F;
  --accent:#62AADB; --accent-ink:#06131C; --accent-soft:#15314A; --accent-strong:#9CCBEB;
  --pulse:#F06A5F; --pulse-soft:#3A1D1B;
  --ok:#5CC28C; --ok-soft:#15301F; --warn:#E2B252; --warn-soft:#352914; --crit:#F06A5F; --crit-soft:#3A1D1B;
  --paper:#1A232C; --paper-ink:#E3E8ED; --paper-line:#2B3742;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:30px} h2{font-size:22px} h3{font-size:17px} h4{font-size:15px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;padding:18px 12px;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:19px;letter-spacing:-.02em}
.brand small{display:block;font-size:11.5px;color:var(--ink-3);letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:none;padding:9px 10px;border-radius:var(--r-s);cursor:pointer;color:var(--ink-2);font-weight:500;text-align:left}
.nav button svg{width:19px;height:19px;flex:none}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-strong)}
.side-foot{margin-top:auto;font-size:12px;color:var(--ink-3);padding:0 8px;display:grid;gap:8px}
.theme-toggle{display:flex;gap:4px}
.theme-toggle button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:4px 0;font-size:12px;cursor:pointer;color:var(--ink-2)}
.theme-toggle button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);border-color:var(--ink-3)}
.main{min-width:0;padding-inline:clamp(16px,3vw,36px);padding-block:22px 60px}
.topbar{display:flex;gap:12px;align-items:center;margin-bottom:22px;position:relative}
.search{flex:1;max-width:560px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px 10px 40px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--ink-3)}
.search-res{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);z-index:40;max-height:60vh;overflow:auto;padding:6px}
.search-res button{display:flex;width:100%;justify-content:space-between;gap:12px;border:0;background:none;padding:9px 10px;border-radius:var(--r-s);cursor:pointer;text-align:left}
.search-res button:hover,.search-res button.hl{background:var(--surface-2)}
.search-res .k{font-size:12px;color:var(--ink-3);white-space:nowrap}
.mnav{display:none}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .mnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .mnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink-3);padding:4px 0;cursor:pointer}
  .mnav button svg{width:21px;height:21px}
  .mnav button[aria-current="page"]{color:var(--accent)}
  h1{font-size:25px}
}

/* ---------- Primitives ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:var(--r-s);cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.chip:hover{color:var(--ink);border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.crit{background:var(--crit-soft);color:var(--crit)} .tag.acc{background:var(--accent-soft);color:var(--accent-strong)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 13px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--ink-2);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.field{display:grid;gap:5px}
.field label,.lbl{font-size:13px;font-weight:500;color:var(--ink-2)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:8px 10px}
textarea.input{resize:vertical;line-height:1.55}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.unit{display:flex;align-items:stretch}
.unit .input{border-top-right-radius:0;border-bottom-right-radius:0;min-width:0}
.unit span,.unit select{border:1px solid var(--line);border-left:0;background:var(--surface-2);border-radius:0 var(--r-s) var(--r-s) 0;padding:0 10px;display:flex;align-items:center;font-size:13px;color:var(--ink-2);white-space:nowrap}
.note{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:var(--r-s);padding:10px 12px}
.note.warn{background:var(--warn-soft);color:var(--ink)}
.divider{height:1px;background:var(--line);margin:4px 0}
.empty{padding:28px;text-align:center;color:var(--ink-3)}
.page-head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.page-head p{color:var(--ink-2);max-width:62ch;margin-top:6px}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--ink-2);cursor:pointer;padding:0;margin-bottom:10px;font-size:14px}
.back:hover{color:var(--accent)}
.back svg{width:16px;height:16px}

/* ---------- Start ---------- */
.hero-strip{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-bottom:26px}
.today{padding:22px 24px;display:grid;gap:16px;align-content:start;position:relative;overflow:hidden}
.today .ecg{position:absolute;right:-6px;top:26px;width:46%;max-width:300px;color:var(--pulse);opacity:.5;pointer-events:none}
.today > *:not(.ecg){position:relative}
.today h1{font-size:32px}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--f-mono);font-size:24px;font-weight:500}
.stat span{font-size:12.5px;color:var(--ink-3)}
.quick{padding:18px 20px;display:grid;gap:10px;align-content:start}
.quick-list{display:grid;gap:4px}
.qrow{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;background:none;padding:8px 10px;margin-inline:-10px;border-radius:var(--r-s);cursor:pointer;text-align:left}
.qrow:hover{background:var(--surface-2)}
.qrow .k{font-size:12px;color:var(--ink-3)}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 12px}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tile{display:grid;gap:8px;padding:16px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);cursor:pointer;text-align:left;align-content:start}
.tile:hover{border-color:var(--accent)}
.tile h3{font-size:16px}
.tile .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tile p{font-size:13.5px;color:var(--ink-2)}
@media (max-width:900px){.hero-strip{grid-template-columns:1fr}.today .ecg{width:55%;opacity:.3;top:14px}}

/* ---------- Fälle / Brief ---------- */
.lvl{display:inline-flex;gap:2px;vertical-align:middle}
.lvl i{width:6px;height:10px;border-radius:2px;background:var(--surface-3)}
.lvl i.on{background:var(--accent)}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--surface-3)}
.status-dot.wip{background:var(--warn)} .status-dot.done{background:var(--ok)}
.ws-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:16px}
.ws{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:18px;align-items:start}
.roh{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;padding:16px 18px}
.roh pre{white-space:pre-wrap;font-family:var(--f-mono);font-size:12.5px;line-height:1.6;margin:8px 0 0;color:var(--ink)}
.roh summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
.roh summary::-webkit-details-marker{display:none}
.editor{display:grid;gap:14px}
.esec{padding:14px 16px;display:grid;gap:8px}
.esec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.esec-h h3{font-size:15.5px}
.esec .hint{font-size:12.5px;color:var(--ink-3)}
.esec textarea{min-height:92px;font-size:14.5px}
.phr{display:flex;flex-wrap:wrap;gap:6px;padding-top:2px}
.phr button{border:1px dashed var(--line);background:var(--surface-2);border-radius:var(--r-s);padding:3px 9px;font-size:12.5px;cursor:pointer;color:var(--ink-2);text-align:left}
.phr button:hover{border-style:solid;border-color:var(--accent);color:var(--ink)}
.wc{font-size:12px;color:var(--ink-3)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.sticky-actions{position:sticky;bottom:12px;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;box-shadow:var(--shadow);display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
@media (max-width:900px){.ws{grid-template-columns:1fr}.roh{position:static;max-height:none}.sticky-actions{bottom:calc(76px + env(safe-area-inset-bottom,0px))}}
.cmp{display:grid;gap:14px}
.cmp-row{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.cmp-row > div{padding:14px 16px;min-width:0}
.cmp-row > div + div{border-left:1px solid var(--line);background:var(--surface-2)}
.cmp-row h4{margin-bottom:6px;font-size:13px;color:var(--ink-3);font-family:var(--f-ui);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.cmp-row .txt{white-space:pre-wrap;font-size:14px}
.cmp-title{grid-column:1/-1;padding:10px 16px !important;background:var(--surface) !important;border-bottom:1px solid var(--line);border-left:0 !important;display:flex;justify-content:space-between}
@media (max-width:700px){.cmp-row{grid-template-columns:1fr}.cmp-row > div + div{border-left:0;border-top:1px solid var(--line)}}
.medtab{width:100%;border-collapse:collapse;font-size:13.5px}
.medtab th{text-align:left;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
.medtab td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.medtab td.mono{white-space:nowrap}
.tw{overflow-x:auto}

/* Paper */
.paper-wrap{display:grid;justify-items:center;gap:14px}
.paper{background:var(--paper);color:var(--paper-ink);width:100%;max-width:800px;border:1px solid var(--paper-line);box-shadow:var(--shadow);padding:clamp(20px,5vw,56px);font-family:var(--f-paper);font-size:15px;line-height:1.6}
.paper .lh{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--paper-ink);padding-bottom:12px;margin-bottom:22px;font-family:var(--f-ui);font-size:12.5px}
.paper .lh b{font-family:var(--f-display);font-size:17px;display:block}
.paper .betreff{font-weight:600;margin-bottom:16px}
.paper h5{font-family:var(--f-ui);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin:20px 0 6px;color:var(--paper-ink);border-bottom:1px solid var(--paper-line);padding-bottom:3px}
.paper .p{white-space:pre-wrap}
.paper .sig{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:40px;font-family:var(--f-ui);font-size:12px}
.paper .sig div{border-top:1px solid var(--paper-ink);padding-top:4px}
.paper .medtab th,.paper .medtab td{border-color:var(--paper-line)}
.paper .medtab{font-family:var(--f-ui)}
.missing{color:var(--ink-3);font-style:italic}

/* Feedback */
.fb{display:grid;gap:14px}
.check{display:grid;gap:2px}
.check label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:var(--r-s);cursor:pointer}
.check label:hover{background:var(--surface-2)}
.check input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.score-ring{display:flex;gap:16px;align-items:center}
.score-ring b{font-family:var(--f-mono);font-size:40px;font-weight:500;line-height:1}
.fb-sec{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.fb-sec:last-child{border-bottom:0}
.fb ul{margin:6px 0 0;padding-left:18px;display:grid;gap:4px}
.ai-out{white-space:pre-wrap}
.thinking{display:inline-flex;align-items:center;gap:8px;color:var(--ink-2)}
.thinking i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.thinking i{animation:none}}

/* ---------- Rechner ---------- */
.calc-layout{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
.calc-list{padding:10px;display:grid;gap:10px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.calc-list .grp{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:8px 8px 2px}
.calc-item{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:0;background:none;padding:7px 8px;border-radius:var(--r-s);cursor:pointer;text-align:left;font-size:14px}
.calc-item:hover{background:var(--surface-2)}
.calc-item[aria-current="true"]{background:var(--accent-soft);color:var(--accent-strong);font-weight:500}
.star{border:0;background:none;cursor:pointer;color:var(--ink-3);padding:2px;line-height:0}
.star svg{width:16px;height:16px}
.star[aria-pressed="true"]{color:var(--warn)}
.star[aria-pressed="true"] svg{fill:currentColor}
.calc-card{padding:20px 22px;display:grid;gap:18px}
.calc-body{display:grid;grid-template-columns:1fr minmax(240px,320px);gap:22px;align-items:start}
.inputs{display:grid;gap:4px}
.inp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.sitem{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 10px;border-radius:var(--r-s);cursor:pointer;border:1px solid transparent}
.sitem:hover{background:var(--surface-2)}
.sitem.on{background:var(--accent-soft);border-color:transparent}
.sitem input{accent-color:var(--accent);width:17px;height:17px;flex:none}
.sitem .l{flex:1;display:flex;gap:10px;align-items:flex-start}
.sitem .pts{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.srow{display:grid;gap:4px;padding:6px 0}
.srow select{width:100%}
.result{position:sticky;top:12px;padding:18px;border-radius:var(--r);background:var(--surface-2);display:grid;gap:12px}
.result .big{font-family:var(--f-mono);font-size:44px;line-height:1;font-weight:500}
.result .big.txt{font-size:26px;line-height:1.15;font-family:var(--f-display);font-weight:700}
.result .big small{font-size:15px;color:var(--ink-2);margin-left:4px}
.result .lines{display:grid;gap:6px}
.result .line{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-bottom:1px dashed var(--line);padding-bottom:5px}
.result .line b{font-family:var(--f-mono);font-weight:500;text-align:right}
.verdict{border-left:4px solid var(--ink-3);padding:8px 12px;background:var(--surface);border-radius:0 var(--r-s) var(--r-s) 0;font-size:14px}
.verdict.ok{border-color:var(--ok)} .verdict.warn{border-color:var(--warn)} .verdict.crit{border-color:var(--crit)} .verdict.info{border-color:var(--accent)}
.ref{font-size:12px;color:var(--ink-3)}
.bga-steps{display:grid;gap:8px;font-size:14px}
.bga-steps div{display:grid;grid-template-columns:22px 1fr;gap:8px}
.bga-steps i{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--ink-3);padding-top:2px}
@media (max-width:1100px){.calc-body{grid-template-columns:1fr}.result{position:static}}
@media (max-width:900px){.calc-layout{grid-template-columns:1fr}.calc-list{position:static;max-height:none}.calc-layout.detail .calc-list{display:none}.calc-layout:not(.detail) .calc-card{display:none}}
@media (min-width:901px){.only-m{display:none !important}}

/* ---------- Referenz ---------- */
.ref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.rcard{padding:16px 18px;display:grid;gap:8px;align-content:start}
.rcard h3{font-size:16px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.dl{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13.5px}
.dl dt{color:var(--ink-2)}
.dl dd{margin:0;font-family:var(--f-mono);font-size:13px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.mono{white-space:nowrap}
.tbl tr:hover td{background:var(--surface-2)}
.copyblock{position:relative;background:var(--surface-2);border-radius:var(--r-s);padding:12px 14px;font-size:14px;white-space:pre-wrap}
.copyblock .btn{position:absolute;top:8px;right:8px}
.copyblock p{padding-right:70px}
.guide{display:grid;gap:12px;max-width:820px}
.guide .rule{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:14px 16px}
.guide .rule .n{font-family:var(--f-mono);color:var(--accent);font-size:15px;padding-top:1px}
.guide .rule p{color:var(--ink-2);font-size:14px;margin-top:4px}
.guide .ex{margin-top:8px;display:grid;gap:6px;font-size:13.5px}
.guide .ex div{padding:8px 10px;border-radius:var(--r-s)}
.guide .ex .bad{background:var(--crit-soft)} .guide .ex .good{background:var(--ok-soft)}
.anatomy{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.anatomy > div{display:grid;grid-template-columns:180px 1fr;gap:14px;padding:11px 16px;border-bottom:1px solid var(--line);font-size:14px}
.anatomy > div:last-child{border-bottom:0}
.anatomy b{font-weight:700}
@media (max-width:600px){.anatomy > div{grid-template-columns:1fr;gap:2px}}

/* ---------- Tutor ---------- */
.chat{display:grid;grid-template-rows:1fr auto;gap:12px;height:calc(100vh - 150px);min-height:420px;max-width:860px}
.msgs{overflow:auto;display:flex;flex-direction:column;gap:12px;padding:4px}
.msg{max-width:88%;padding:11px 14px;border-radius:12px;white-space:pre-wrap;font-size:14.5px}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-height:48px;max-height:180px}
@media (max-width:900px){.chat{height:calc(100vh - 230px)}}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:100;box-shadow:var(--shadow)}
@media (max-width:900px){.toast{bottom:calc(90px + env(safe-area-inset-bottom,0px))}}
.stack{display:grid;gap:14px}
body:not(.ai-on) .ai-only{display:none !important}
body:not(.ai-off) .ai-off-only{display:none !important}
.fbws{grid-template-columns:minmax(280px,420px) 1fr}
@media (max-width:900px){.fbws{grid-template-columns:1fr}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

{id:'nstemi',fach:'innere',sub:'Kardiologie',titel:'NSTEMI mit PCI des RIVA',level:2,typ:'Entlassungsbericht',
pat:{name:'Herr Klaus M.',geb:'14.03.1959',sex:'m',alter:67},klinik:'Medizinische Klinik II · Kardiologie und Angiologie',von:'03.09.2026',bis:'07.09.2026',
roh:`AUFNAHME 03.09. 07:40 via RD (NA-Protokoll liegt bei)
67 J., m. Seit ca. 2 h retrosternaler Druck, Ausstrahlung li. Arm, Dyspnoe, kaltschweißig. Seit 2 Wo. ähnl. Druck bei Treppensteigen, in Ruhe sistierend.
VE: aHT, DM2 (oral), Hypercholesterinämie (keine Therapie). Nikotin aktiv, ca. 40 py. Alk. gelegentl.
Vormed.: Ramipril 5 mg 1-0-0, Metformin 1000 mg 1-0-1
Allergien: keine bek.
Sozial: verh., Rentner (Elektriker), selbstständig.

KU: RR 158/92, HF 96, SpO2 95 % RL, AF 18, T 36,8. Wach, orientiert, blass-schweißig. Cor: rein, rhythm., keine Geräusche. Pulmo: VAG bds., keine RG. Abd. weich, kein DS. Keine Ödeme. Pulse allseits tastbar.

EKG 03.09.: SR 94/min, LT, ST-Senkung 1 mm V4–V6, keine ST-Hebung.
Lab: hs-TnT 86 -> 412 ng/l (3 h), CK 320 U/l, Krea 1,0 mg/dl, K 4,1, Hb 14,6, HbA1c 7,8 %, LDL 148 mg/dl.

HKU 03.09. (radial re.): 1-GE-KHK, RIVA proximal 90 % -> PCI + 1x DES. RCX/RCA ohne relev. Stenosen. LVEF angiogr. ca. 50 %.
TTE 04.09.: LVEF 50 %, Hypokinesie anteroseptal, keine rel. Vitien, kein Perikarderguss.

VERLAUF: postinterv. beschwerdefrei, Monitor ohne HRST. Radialis re. unauffällig. Mobilisation problemlos, Belastung auf Station ok.
Metformin 48 h nach KM pausiert, Krea 05.09. 1,0 -> wieder angesetzt.
Rauchstoppberatung erfolgt, Pat. motiviert.
Neu: ASS 100, Prasugrel 10 (Loading 60 mg am 03.09.), Atorvastatin 80, Bisoprolol 2,5, Pantoprazol 40. Ramipril 5 weiter.
AHB (kardiol. Reha) beantragt. LDL-Ziel < 55.
Entlassung 07.09. nach Hause.`,
muster:{
diagnosen:`Nicht-ST-Hebungs-Myokardinfarkt (NSTEMI) (I21.4)
– Koronare 1-Gefäß-Erkrankung mit 90%iger proximaler RIVA-Stenose
– PCI mit Implantation von 1 DES in den proximalen RIVA am 03.09.2026 (Zugang A. radialis rechts)
– Leicht eingeschränkte LV-Funktion (LVEF 50 %) mit anteroseptaler Hypokinesie

Nebendiagnosen:
– Arterielle Hypertonie
– Diabetes mellitus Typ 2, nicht insulinpflichtig (HbA1c 7,8 %)
– Hypercholesterinämie (LDL-C 148 mg/dl)
– Nikotinabusus (ca. 40 pack years)`,
anamnese:`Die Vorstellung erfolgte am 03.09. über den Rettungsdienst mit seit etwa zwei Stunden bestehendem retrosternalem Druckgefühl mit Ausstrahlung in den linken Arm, begleitet von Dyspnoe und Kaltschweißigkeit. Bereits seit zwei Wochen habe Herr M. ein ähnliches Druckgefühl beim Treppensteigen bemerkt, das sich in Ruhe rasch zurückgebildet habe.
Vorerkrankungen: arterielle Hypertonie, Diabetes mellitus Typ 2, bislang unbehandelte Hypercholesterinämie.
Vormedikation: Ramipril 5 mg 1-0-0, Metformin 1000 mg 1-0-1.
Allergien: keine bekannt.
Noxen: aktiver Raucher (ca. 40 pack years), Alkohol gelegentlich.
Sozialanamnese: verheiratet, berenteter Elektriker, im Alltag selbstständig.`,
befund:`67-jähriger Patient in reduziertem Allgemeinzustand, blass und kaltschweißig. RR 158/92 mmHg, HF 96/min, SpO2 95 % unter Raumluft, AF 18/min, Temperatur 36,8 °C. Wach und allseits orientiert.
Cor: Herztöne rein, rhythmisch, keine pathologischen Geräusche. Pulmo: Vesikuläratmen beidseits, keine Rasselgeräusche. Abdomen: weich, kein Druckschmerz. Extremitäten: keine Ödeme, periphere Pulse allseits tastbar.`,
diagnostik:`Labor (Aufnahme): hs-Troponin T 86 ng/l, nach 3 h 412 ng/l; CK 320 U/l; Kreatinin 1,0 mg/dl; Kalium 4,1 mmol/l; Hb 14,6 g/dl; HbA1c 7,8 %; LDL-C 148 mg/dl.
EKG (03.09.): Sinusrhythmus 94/min, Linkstyp, horizontale ST-Senkungen von 1 mm in V4–V6, keine ST-Hebungen.
Koronarangiographie (03.09.): Koronare 1-Gefäß-Erkrankung mit 90%iger proximaler RIVA-Stenose, PCI mit Implantation eines DES. RCX und RCA ohne relevante Stenosen. Angiographische LVEF ca. 50 %.
TTE (04.09.): LVEF 50 % mit anteroseptaler Hypokinesie, keine relevanten Vitien, kein Perikarderguss.`,
epikrise:`Herr M. wurde mit typischer Angina pectoris und einer vorausgehenden zweiwöchigen Crescendo-Symptomatik aufgenommen. Bei dynamischem Anstieg des hs-Troponin T (86 → 412 ng/l) und lateralen ST-Senkungen stellten wir die Diagnose eines NSTEMI. Aufgrund der Hochrisikokonstellation erfolgte die Koronarangiographie noch am Aufnahmetag. Als Ursache zeigte sich eine hochgradige proximale RIVA-Stenose, die wir mittels PCI und Implantation eines medikamentenfreisetzenden Stents erfolgreich versorgten. Echokardiographisch fand sich eine leicht eingeschränkte LV-Funktion (LVEF 50 %) mit anteroseptaler Hypokinesie.
Wir leiteten eine duale Thrombozytenaggregationshemmung mit ASS und Prasugrel ein und begannen eine hochdosierte Statintherapie sowie eine Betablockade. Metformin pausierten wir periinterventionell für 48 Stunden und setzten es bei stabiler Nierenfunktion am 05.09. wieder an.
Der weitere Verlauf gestaltete sich komplikationslos. Herr M. war beschwerdefrei, am Monitor ohne Rhythmusstörungen, die Punktionsstelle unauffällig. Eine Rauchstoppberatung erfolgte, Herr M. ist hochmotiviert. Die kardiologische Anschlussheilbehandlung ist beantragt. Wir entlassen Herrn M. am 07.09. in gutem Allgemeinzustand nach Hause.`,
procedere:`– Duale Thrombozytenaggregationshemmung (ASS 100 mg + Prasugrel 10 mg) für 12 Monate bis 09/2027, danach ASS-Monotherapie lebenslang. Prasugrel bitte nicht vorzeitig absetzen (Stentthrombose-Risiko); vor elektiven Eingriffen Rücksprache mit uns.
– LDL-C-Kontrolle in 4–6 Wochen. Ziel < 55 mg/dl und ≥ 50 % Senkung vom Ausgangswert; bei Nichterreichen bitte Ezetimib ergänzen.
– Bisoprolol und Ramipril nach Blutdruck und Herzfrequenz auftitrieren, Ziel-RR < 130/80 mmHg.
– Optimierung der Diabetestherapie (HbA1c 7,8 %); wir empfehlen die Ergänzung eines SGLT2-Inhibitors oder GLP-1-Rezeptoragonisten mit kardiovaskulärem Nutzen.
– Kardiologische Rehabilitation (AHB) ist beantragt.
– Echokardiographische Kontrolle der LV-Funktion in 3 Monaten.
– Konsequenter Rauchverzicht.
– Bei erneuter Angina pectoris bitte sofortige Vorstellung (112).`},
med:[['Acetylsalicylsäure','100 mg','1-0-0-0','lebenslang','neu'],['Prasugrel','10 mg','1-0-0-0','bis 09/2027','neu'],['Atorvastatin','80 mg','0-0-1-0','','neu'],['Bisoprolol','2,5 mg','1-0-0-0','','neu'],['Ramipril','5 mg','1-0-0-0','','unverändert'],['Metformin','1000 mg','1-0-1-0','','unverändert'],['Pantoprazol','40 mg','1-0-0-0','für Dauer der DAPT','neu']],

{id:'cap',fach:'innere',sub:'Pneumologie',titel:'Ambulant erworbene Pneumonie',level:1,typ:'Entlassungsbericht',
pat:{name:'Frau Hannelore B.',geb:'02.11.1953',sex:'w',alter:72},klinik:'Medizinische Klinik I · Pneumologie und Infektiologie',von:'04.09.2026',bis:'08.09.2026',
roh:`AUFNAHME 04.09. ZNA, Einweisung HA
72 J., w. Seit 3 d Fieber bis 39,2 °C, produkt. Husten (gelbl.), Belastungsdyspnoe, atemabh. Schmerz re. thorakal. Kein Auslandsaufenthalt, kein KH-Aufenthalt letzte 3 Mon., keine AB-Vorbeh.
VE: aHT, Hypothyreose. Nichtraucherin. Impfstatus Pneumokokken/Influenza unklar.
Vormed.: Candesartan 8 mg 1-0-0, L-Thyroxin 75 µg 1-0-0
Allergien: keine bek.
Sozial: lebt mit Ehemann, selbstständig.

KU: T 38,9, RR 128/74, HF 102, AF 24, SpO2 91 % RL. Orientiert. Pulmo: feinblasige RG re. basal, Bronchialatmen re. UF. Cor rein. Abd. unauff. Keine Ödeme.
CRB-65: 1 (Alter). Keine Verwirrtheit.

Lab: Leuko 16,2 /nl, CRP 186 mg/l, PCT 1,2 ng/ml, Krea 1,1 mg/dl, Harnstoff 48 mg/dl, Na 134 mmol/l.
BGA (RL): pO2 62 mmHg, pCO2 34, pH 7,45.
Rö-Thx 04.09.: Infiltrat re. UL, kein Erguss, keine Stauung.
BK 2x2: steril. Urin-Ag Legionellen/Pneumokokken: neg.

VERLAUF: Ampicillin/Sulbactam 3 g i.v. 1-1-1 04.–06.09. + Clarithromycin 500 mg 1-0-1 04.–06.09. (3 d).
O2 2 l/min NB 04.–05.09., danach SpO2 95 % RL. Entfiebert ab 05.09.
CRP 186 -> 42 (07.09.). Leuko 9,1.
07.09. Oralisierung Amoxicillin/Clavulansäure 875/125 mg 1-0-1, letzte Gabe 08.09. abends (Gesamtdauer 5 d).
Mobilisation selbstständig. Entlassung 08.09.`,
muster:{
diagnosen:`Ambulant erworbene Pneumonie im rechten Unterlappen (J18.1), mittelschwer
– CRB-65-Score 1, initial Hypoxämie (pO2 62 mmHg unter Raumluft)
– Kein Erregernachweis (Blutkulturen steril, Urin-Antigene negativ)

Nebendiagnosen:
– Arterielle Hypertonie
– Hypothyreose, substituiert`,
anamnese:`Die Einweisung erfolgte durch Sie bei seit drei Tagen bestehendem Fieber bis 39,2 °C, produktivem Husten mit gelblichem Auswurf, Belastungsdyspnoe sowie atemabhängigen Schmerzen rechts thorakal. Ein Krankenhausaufenthalt oder eine antibiotische Vorbehandlung in den letzten drei Monaten sowie Auslandsreisen wurden verneint.
Vorerkrankungen: arterielle Hypertonie, Hypothyreose.
Vormedikation: Candesartan 8 mg 1-0-0, L-Thyroxin 75 µg 1-0-0.
Allergien: keine bekannt. Nichtraucherin. Impfstatus (Pneumokokken, Influenza) unklar.
Sozialanamnese: lebt mit ihrem Ehemann, im Alltag selbstständig.`,
befund:`72-jährige Patientin in reduziertem Allgemeinzustand. Temperatur 38,9 °C, RR 128/74 mmHg, HF 102/min, AF 24/min, SpO2 91 % unter Raumluft. Wach und orientiert.
Pulmo: feinblasige Rasselgeräusche und Bronchialatmen rechts basal. Cor: Herztöne rein, tachykard. Abdomen unauffällig. Keine peripheren Ödeme.`,
diagnostik:`Labor (Aufnahme): Leukozyten 16,2/nl, CRP 186 mg/l, PCT 1,2 ng/ml, Kreatinin 1,1 mg/dl, Harnstoff 48 mg/dl, Natrium 134 mmol/l. Im Verlauf CRP 42 mg/l, Leukozyten 9,1/nl (07.09.).
BGA unter Raumluft: pO2 62 mmHg, pCO2 34 mmHg, pH 7,45.
Röntgen-Thorax (04.09.): Infiltrat im rechten Unterlappen, kein Pleuraerguss, keine Stauungszeichen.
Mikrobiologie: Blutkulturen (2 Paare) steril. Legionellen- und Pneumokokken-Antigen im Urin negativ.`,
epikrise:`Frau B. wurde mit den klinischen und radiologischen Zeichen einer ambulant erworbenen Pneumonie des rechten Unterlappens aufgenommen. Trotz eines CRB-65-Scores von 1 war bei Hypoxämie eine stationäre Behandlung indiziert. Wir begannen leitliniengerecht eine kalkulierte Therapie mit Ampicillin/Sulbactam i.v., kombiniert mit Clarithromycin für drei Tage zur Abdeckung atypischer Erreger. Unter zusätzlicher Sauerstoffgabe über zwei Tage besserte sich die Oxygenierung rasch; ab dem 05.09. war Frau B. fieberfrei. Die Entzündungswerte waren deutlich rückläufig (CRP 186 → 42 mg/l).
Ein Erregernachweis gelang nicht. Bei klinischer Stabilität stellten wir am 07.09. auf orales Amoxicillin/Clavulansäure um. Die antibiotische Therapie ist mit der letzten Gabe am 08.09. abends nach insgesamt fünf Tagen abgeschlossen. Wir entlassen Frau B. am 08.09. in gebessertem Allgemeinzustand nach Hause.`,
procedere:`– Letzte Gabe Amoxicillin/Clavulansäure am 08.09. abends, danach keine weitere Antibiose erforderlich.
– Klinische Kontrolle in Ihrer Praxis in etwa einer Woche. Eine routinemäßige Röntgenkontrolle ist bei unkompliziertem Verlauf nicht erforderlich; bei persistierenden Beschwerden nach 6–8 Wochen empfehlen wir eine erneute Bildgebung.
– Wir empfehlen die Pneumokokken- und die saisonale Influenza-Impfung (Impfstatus unklar) sowie eine COVID-19-Auffrischung gemäß STIKO.
– Bei erneutem Fieber, Luftnot oder Verschlechterung bitte umgehende Wiedervorstellung.`},
med:[['Amoxicillin/Clavulansäure','875/125 mg','1-0-1-0','letzte Gabe 08.09. abends','neu'],['Candesartan','8 mg','1-0-0-0','','unverändert'],['Levothyroxin','75 µg','1-0-0-0','nüchtern','unverändert']],
check:['Schweregrad bzw. CRB-65 genannt','Begründung der stationären Aufnahme trotz niedrigem Score (Hypoxämie)','Kalkulierte Antibiose mit Substanz und Dauer','Mikrobiologie inklusive negativer Befunde','Verlauf der Entzündungswerte','Konkretes Ende der Antibiose mit Datum','Impfempfehlung','Warnzeichen für Wiedervorstellung'],

{id:'ogib',fach:'innere',sub:'Gastroenterologie',titel:'Obere GI-Blutung bei Ulcus duodeni',level:2,typ:'Entlassungsbericht',
pat:{name:'Herr Werner S.',geb:'27.06.1968',sex:'m',alter:58},klinik:'Medizinische Klinik I · Gastroenterologie',von:'10.09.2026',bis:'15.09.2026',
roh:`AUFNAHME 10.09. ZNA
58 J., m. Seit 2 d schwarzer, klebriger Stuhl, Schwindel, heute 1x kurz kollabiert (kein Trauma). Seit 3 Wo. Ibuprofen 600 mg 1-1-1 wg. Rückenschmerzen (selbst gekauft). Keine Voroperationen. Alkohol gelegentl., kein Nikotin. Keine Antikoagulation.
Vormed.: Ibuprofen s.o., sonst keine.
Allergien: keine.

KU: RR 98/60, HF 112, blass, kaltschweißig. Abd. weich, leichter DS Epigastrium. DRU: Teerstuhl.
GBS (Glasgow-Blatchford): 12.

Lab: Hb 7,2 g/dl (kein Vorwert), MCV 84, Harnstoff 92 mg/dl, Krea 1,0, Quick 98 %, Thrombos 312. Ferritin 18 µg/l.

Notfall-ÖGD 10.09. (< 12 h): Ulcus duodeni Bulbushinterwand 1,5 cm, Forrest IIa (sichtbarer Gefäßstumpf) -> Unterspritzung Adrenalin 1:10.000 + 2 Hämoclips. Magen: Antrumgastritis, HUT positiv.
Histo Antrum: chron.-aktive Gastritis, H. pylori positiv.

VERLAUF: 2 EK 10.09., Hb 7,2 -> 9,1 -> 9,3 stabil. Kein Rezidiv.
Pantoprazol 80 mg Bolus, dann 8 mg/h für 72 h -> oral 40 mg 1-0-1.
Ibuprofen abgesetzt, Metamizol bei Bedarf.
Eisencarboxymaltose 1000 mg i.v. 13.09.
Eradikation begonnen 13.09.: Bismut-Quadrupeltherapie (Bismutkalium/Metronidazol/Tetracyclin 3 Kps 1-1-1-1 + Pantoprazol 40 mg 1-0-1) für 10 d, Ende 22.09.
Kostaufbau problemlos. Entlassung 15.09.`,
muster:{
diagnosen:`Obere gastrointestinale Blutung bei Ulcus duodeni an der Bulbushinterwand (K26.4), Forrest IIa
– NSAR-assoziiert (Ibuprofen 1800 mg/d über 3 Wochen) und Helicobacter-pylori-positiv
– Endoskopische Blutstillung mit Adrenalin-Unterspritzung und 2 Hämoclips am 10.09.2026
– Transfusion von 2 Erythrozytenkonzentraten
Akute Blutungsanämie mit Eisenmangel (initial Hb 7,2 g/dl, Ferritin 18 µg/l)
– Eisencarboxymaltose 1000 mg i.v. am 13.09.2026
Chronisch-aktive H.-pylori-Gastritis des Antrums
– Beginn einer Bismut-Quadrupeltherapie am 13.09.2026`,
anamnese:`Herr S. stellte sich mit seit zwei Tagen bestehendem Teerstuhl, Schwindel und einem einmaligen kurzen Kollaps ohne Trauma in unserer Notaufnahme vor. Seit drei Wochen nahm er wegen Rückenschmerzen selbstständig Ibuprofen 600 mg dreimal täglich ein. Eine Antikoagulation bestand nicht.
Vorerkrankungen: keine. Voroperationen: keine.
Vormedikation: Ibuprofen 600 mg 1-1-1 (Selbstmedikation).
Allergien: keine bekannt. Noxen: Alkohol gelegentlich, Nichtraucher.`,
befund:`58-jähriger Patient in reduziertem Allgemeinzustand, blass und kaltschweißig. RR 98/60 mmHg, HF 112/min. Abdomen weich, leichter Druckschmerz epigastrisch, keine Abwehrspannung. Digital-rektale Untersuchung: Teerstuhl am Fingerling. Glasgow-Blatchford-Score 12.`,
diagnostik:`Labor (Aufnahme): Hb 7,2 g/dl, MCV 84 fl, Harnstoff 92 mg/dl, Kreatinin 1,0 mg/dl, Quick 98 %, Thrombozyten 312/nl, Ferritin 18 µg/l. Nach Transfusion Hb 9,1 und 9,3 g/dl (stabil).
Notfall-ÖGD (10.09.): 1,5 cm großes Ulcus duodeni an der Bulbushinterwand mit sichtbarem Gefäßstumpf (Forrest IIa), Unterspritzung mit Adrenalin 1:10.000 und Setzen von 2 Hämoclips. Antrumgastritis, Urease-Schnelltest positiv.
Histologie (Antrum): chronisch-aktive Gastritis, Helicobacter pylori positiv.`,
epikrise:`Herr S. wurde mit Teerstuhl und Schocksymptomatik (HF 112/min, RR 98/60 mmHg) aufgenommen. Bei hohem Risiko (Glasgow-Blatchford-Score 12) erfolgte nach Kreislaufstabilisierung und Transfusion von 2 Erythrozytenkonzentraten innerhalb von 12 Stunden die Notfallgastroskopie. Als Blutungsquelle zeigte sich ein Ulcus duodeni mit sichtbarem Gefäßstumpf (Forrest IIa), das wir durch Unterspritzung und Clip-Applikation sicher versorgten. Ursächlich sehen wir die Kombination aus hochdosierter NSAR-Einnahme und einer Helicobacter-pylori-Infektion.
Nach 72-stündiger hochdosierter intravenöser PPI-Therapie stellten wir auf orales Pantoprazol um. Es kam zu keiner Rezidivblutung, der Hb-Wert blieb stabil. Ibuprofen haben wir abgesetzt. Den begleitenden Eisenmangel substituierten wir intravenös. Am 13.09. begannen wir die Eradikationstherapie. Nach problemlosem Kostaufbau entlassen wir Herrn S. am 15.09. in stabilem Zustand.`,
procedere:`– Fortführung der Bismut-Quadrupeltherapie bis einschließlich 22.09. (insgesamt 10 Tage). Bitte auf Einnahme zu den Mahlzeiten und Alkoholkarenz (Metronidazol) achten.
– Danach Pantoprazol 40 mg 1-0-0 für weitere 4 Wochen, anschließend Absetzen.
– Eradikationskontrolle mittels 13C-Harnstoff-Atemtest frühestens 4 Wochen nach Ende der Eradikation und mindestens 2 Wochen nach Absetzen des PPI.
– Hb-Kontrolle in einer Woche.
– Keine NSAR. Analgesie bei Bedarf mit Metamizol oder Paracetamol; bei zwingender NSAR-Indikation nur unter PPI-Schutz.
– Eine Kontroll-ÖGD ist beim Ulcus duodeni nach erfolgreicher Eradikation nicht routinemäßig erforderlich.
– Bei erneutem Teerstuhl, Bluterbrechen oder Schwindel bitte sofortige Vorstellung.`},

{id:'hf',fach:'innere',sub:'Kardiologie',titel:'Dekompensierte Herzinsuffizienz (HFrEF)',level:3,typ:'Entlassungsbericht',
pat:{name:'Frau Gisela L.',geb:'19.01.1947',sex:'w',alter:79},klinik:'Medizinische Klinik II · Kardiologie',von:'12.09.2026',bis:'19.09.2026',
roh:`AUFNAHME 12.09. ZNA
79 J., w. Seit 1 Wo. zunehmende Dyspnoe (jetzt bei geringster Belastung), Orthopnoe (3 Kissen), Beinödeme, Gewicht +4 kg. Seit 10 d Diclofenac 75 mg 1-0-1 wg. Knieschmerzen (Orthopäde).
VE: ischäm. KMP, LVEF 30 % (bek. seit 2024), Z.n. PCI RCA 2019; VHF permanent; CKD G3a (Krea-Baseline 1,2); aHT.
Vormed.: Ramipril 5 mg 1-0-0, Bisoprolol 5 mg 1-0-0, Torasemid 10 mg 1-0-0, Apixaban 5 mg 1-0-1, Atorvastatin 40 0-0-1, Diclofenac s.o.
Allergien: keine. Lebt allein, Tochter im Ort. Gewicht Aufnahme 74 kg.

KU: RR 142/88, HF 92 arrhythm., SpO2 89 % RL, AF 26. Feuchte RG bds. basal, JVD, Beinödeme bis Knie bds. Cor: 2/6 Systolikum Apex.

Lab: NT-proBNP 8.400 pg/ml, Krea 1,5 (eGFR 33), K 4,8, Na 136, hs-TnT 28 -> 29 ng/l, Hb 12,1, TSH normal.
EKG: VHF, HF 90, LSB bek., QRS 128 ms.
Rö-Thx: pulmonalvenöse Stauung, Ergüsse bds.
TTE 13.09.: LVEF 30 %, globale HK, mittelgr. funktionelle MI, sPAP 45 mmHg.

VERLAUF: Furosemid 40 mg i.v. 1-1-0 12.–16.09., dann Torasemid 20 mg p.o. Gewicht 74 -> 68 kg. SpO2 95 % RL ab 15.09.
Diclofenac abgesetzt -> Paracetamol.
Ramipril pausiert 15.09., nach 36 h Sacubitril/Valsartan 24/26 mg 1-0-1 ab 17.09. (RR 118/70), 19.09. auf 49/51 mg 1-0-1.
Dapagliflozin 10 mg ab 15.09.
Spironolacton: bei K 4,8 und eGFR 33 vorerst nicht begonnen.
Krea bei Entlassung 1,3, K 4,6.
Schulung: tägl. Wiegen, Trinkmenge. Entlassung 19.09., Pflegedienst organisiert.`,
muster:{
diagnosen:`Akut dekompensierte Herzinsuffizienz mit reduzierter Ejektionsfraktion (HFrEF) (I50.14), NYHA IV bei Aufnahme
– Auslöser: NSAR-Einnahme (Diclofenac)
– Ischämische Kardiomyopathie, LVEF 30 %, mittelgradige funktionelle Mitralinsuffizienz
– Linksschenkelblock, QRS 128 ms
– Rekompensation mit Gewichtsreduktion um 6 kg (74 → 68 kg)

Nebendiagnosen:
– Koronare Herzerkrankung, Z. n. PCI der RCA 2019
– Permanentes Vorhofflimmern, CHA2DS2-VA 5, orale Antikoagulation mit Apixaban
– Chronische Nierenerkrankung G3a (Krea-Baseline 1,2 mg/dl)
– Arterielle Hypertonie`,
anamnese:`Frau L. stellte sich mit seit einer Woche progredienter Dyspnoe, zuletzt bei geringster Belastung, Orthopnoe (drei Kissen) und zunehmenden Beinödemen vor. Das Körpergewicht sei um 4 kg gestiegen. Seit zehn Tagen nahm sie wegen Knieschmerzen Diclofenac 75 mg zweimal täglich ein.
Vorerkrankungen: ischämische Kardiomyopathie mit LVEF 30 % (bekannt seit 2024), Z. n. PCI der RCA 2019, permanentes Vorhofflimmern, CKD G3a, arterielle Hypertonie.
Vormedikation: Ramipril 5 mg 1-0-0, Bisoprolol 5 mg 1-0-0, Torasemid 10 mg 1-0-0, Apixaban 5 mg 1-0-1, Atorvastatin 40 mg 0-0-1, Diclofenac 75 mg 1-0-1.
Allergien: keine bekannt. Sozialanamnese: lebt allein, Tochter wohnt im Ort.`,
befund:`79-jährige Patientin in reduziertem Allgemeinzustand, dyspnoisch. RR 142/88 mmHg, HF 92/min arrhythmisch, SpO2 89 % unter Raumluft, AF 26/min. Gewicht 74 kg.
Halsvenen gestaut. Pulmo: feuchte Rasselgeräusche beidseits basal. Cor: arrhythmisch, 2/6-Systolikum über der Herzspitze. Beinödeme beidseits bis zum Knie.`,
diagnostik:`Labor (Aufnahme): NT-proBNP 8.400 pg/ml, Kreatinin 1,5 mg/dl (eGFR 33 ml/min), Kalium 4,8 mmol/l, Natrium 136 mmol/l, hs-Troponin T 28 → 29 ng/l (nicht dynamisch), Hb 12,1 g/dl, TSH normal. Bei Entlassung Kreatinin 1,3 mg/dl, Kalium 4,6 mmol/l.
EKG: Vorhofflimmern, HF 90/min, bekannter Linksschenkelblock (QRS 128 ms).
Röntgen-Thorax: pulmonalvenöse Stauung, Pleuraergüsse beidseits.
TTE (13.09.): LVEF 30 % bei globaler Hypokinesie, mittelgradige funktionelle Mitralinsuffizienz, sPAP 45 mmHg.`,
epikrise:`Frau L. wurde mit einer akut dekompensierten Herzinsuffizienz bei bekannter ischämischer Kardiomyopathie aufgenommen. Als Auslöser werten wir die Einnahme von Diclofenac; ein akutes Koronarsyndrom schlossen wir bei nicht dynamischem Troponin aus. Unter intravenöser Diurese mit Furosemid kam es zu einer Gewichtsabnahme um 6 kg und einer vollständigen Rekompensation. Diclofenac haben wir abgesetzt und auf Paracetamol umgestellt.
Die Herzinsuffizienztherapie haben wir leitliniengerecht erweitert: Nach 36-stündiger Pause von Ramipril stellten wir auf Sacubitril/Valsartan um und steigerten bei guter Verträglichkeit auf 49/51 mg zweimal täglich. Zusätzlich begannen wir Dapagliflozin. Auf einen Mineralokortikoid-Rezeptor-Antagonisten verzichteten wir vorerst bei Kalium 4,8 mmol/l und eGFR 33 ml/min. Die Nierenfunktion besserte sich im Verlauf (Kreatinin 1,3 mg/dl).
Frau L. wurde zu täglichem Wiegen und angepasster Trinkmenge geschult. Ein Pflegedienst ist organisiert. Wir entlassen sie am 19.09. rekompensiert nach Hause (Entlassgewicht 68 kg).`,
procedere:`– Kontrolle von Kreatinin und Kalium in 1–2 Wochen (neu Sacubitril/Valsartan und Dapagliflozin).
– Bei stabilen Werten (K+ < 5,0 mmol/l, eGFR > 30 ml/min) bitte Beginn von Spironolacton 12,5 mg und Auftitration von Sacubitril/Valsartan auf 97/103 mg 1-0-1.
– Tägliches Wiegen. Zielgewicht 68 kg. Bei Zunahme > 2 kg in 3 Tagen bitte Torasemid-Anpassung bzw. Vorstellung.
– Trinkmenge etwa 1,5 l/Tag.
– Keine NSAR (Diclofenac, Ibuprofen), auch nicht als Salbe in großer Menge.
– Kardiologische Kontrolle in 3 Monaten mit Echokardiographie: bei LVEF ≤ 35 % unter optimaler Therapie und LSB bitte Evaluation einer CRT-Implantation.`},

{id:'aki',fach:'geri',sub:'Nephrologie',titel:'Akutes Nierenversagen bei Exsikkose',level:2,typ:'Entlassungsbericht',
pat:{name:'Herr Friedrich D.',geb:'08.05.1942',sex:'m',alter:84},klinik:'Klinik für Geriatrie',von:'02.09.2026',bis:'09.09.2026',
roh:`AUFNAHME 02.09. Einweisung HA
84 J., m. Seit 4 d wässrige Durchfälle (6–8x/d), Übelkeit, kaum getrunken, Schwindel beim Aufstehen, zunehmend schwach. Ehefrau ähnliche Symptome.
VE: aHT, DM2, Hypercholesterinämie, beginnende Demenz? (MMST 26 im Mai).
Vormed.: Ramipril 10 mg 1-0-0, HCT 25 mg 1-0-0, Metformin 1000 mg 1-0-1, Simvastatin 20 mg 0-0-1
Lebt mit Ehefrau im EFH, Rollator, Barthel vor Erkrankung 85.

KU: RR 102/58 (liegend), orthostat. Abfall 20 mmHg, HF 98, T 37,6. Trockene Schleimhäute, stehende Hautfalten. Abd. weich, reger DG, diffus leicht druckdolent.
Lab: Krea 3,2 mg/dl (Baseline 1,1 vor 3 Mon.), Harnstoff 140 mg/dl, K 5,9, Na 131, BGA: pH 7,31, HCO3 18, Laktat 2,0. CRP 22. BZ 164.
Urin: FeNa 0,6 %.
Sono Abd.: Nieren bds. normal groß, kein Harnstau, Blase leer.
Stuhl: Norovirus-PCR positiv. EKG: SR, keine Hyperkaliämiezeichen.

VERLAUF: Isolation. Ramipril, HCT, Metformin pausiert. Balancierte Vollelektrolytlösung 2–3 l/d i.v. für 3 d, dann oral ausreichend.
K 5,9 -> 4,4 (ohne spezif. Therapie außer Volumen, einmalig Insulin/Glucose 02.09.).
Krea: 3,2 -> 2,1 -> 1,5 -> 1,3 (08.09.). Na 138. Durchfälle sistiert 05.09.
RR ohne Antihypertensiva 125–140/70.
Metformin pausiert, BZ 140–190 unter Korrekturschema.
Barthel bei Entlassung 80. Physiotherapie. Sick-Day-Regeln mit Pat. und Ehefrau besprochen.
Entlassung 09.09.`,
muster:{
diagnosen:`Akute Nierenschädigung KDIGO-Stadium 2 (N17.9), prärenal
– Hypovolämie bei Norovirus-Gastroenteritis (A08.1)
– Begünstigt durch RAAS-Blockade (Ramipril) und Thiaziddiuretikum
– Kreatinin 3,2 → 1,3 mg/dl (Baseline 1,1 mg/dl)
Hyperkaliämie (max. 5,9 mmol/l) und Hyponatriämie (131 mmol/l)
Metabolische Azidose (pH 7,31, HCO3− 18 mmol/l)

Nebendiagnosen:
– Arterielle Hypertonie
– Diabetes mellitus Typ 2
– Hypercholesterinämie
– Leichte kognitive Beeinträchtigung (MMST 26/30, 05/2026)
– Gangunsicherheit, Rollatorversorgung (Barthel-Index 80)`,
anamnese:`Herr D. wurde durch Sie bei seit vier Tagen bestehenden wässrigen Durchfällen (6–8 pro Tag), Übelkeit und deutlich reduzierter Trinkmenge eingewiesen. Er klagte über Schwindel beim Aufstehen und zunehmende Schwäche. Die Ehefrau habe ähnliche Symptome.
Vorerkrankungen: arterielle Hypertonie, Diabetes mellitus Typ 2, Hypercholesterinämie, leichte kognitive Beeinträchtigung.
Vormedikation: Ramipril 10 mg 1-0-0, Hydrochlorothiazid 25 mg 1-0-0, Metformin 1000 mg 1-0-1, Simvastatin 20 mg 0-0-1.
Sozialanamnese: lebt mit der Ehefrau im Einfamilienhaus, mit Rollator mobil, Barthel-Index vor Erkrankung 85.`,
befund:`84-jähriger Patient in reduziertem Allgemeinzustand. RR 102/58 mmHg im Liegen mit orthostatischem Abfall um 20 mmHg, HF 98/min, Temperatur 37,6 °C. Trockene Schleimhäute, stehende Hautfalten. Abdomen weich, lebhafte Darmgeräusche, diffuser leichter Druckschmerz ohne Abwehrspannung. Wach, orientiert.`,
diagnostik:`Labor (Aufnahme): Kreatinin 3,2 mg/dl (Baseline 1,1 mg/dl), Harnstoff 140 mg/dl, Kalium 5,9 mmol/l, Natrium 131 mmol/l, CRP 22 mg/l, Blutzucker 164 mg/dl. BGA: pH 7,31, HCO3− 18 mmol/l, Laktat 2,0 mmol/l. FeNa 0,6 %.
Verlauf Kreatinin: 3,2 → 2,1 → 1,5 → 1,3 mg/dl (08.09.); Kalium 4,4, Natrium 138 mmol/l.
Stuhl: Norovirus-PCR positiv.
Sonographie Abdomen: Nieren beidseits normal groß, kein Harnstau, Harnblase leer.
EKG: Sinusrhythmus, keine Hyperkaliämiezeichen.`,
epikrise:`Herr D. wurde mit einer akuten Nierenschädigung im Stadium KDIGO 2 bei ausgeprägter Hypovolämie infolge einer Norovirus-Gastroenteritis aufgenommen. Die niedrige fraktionelle Natriumexkretion und der sonographische Ausschluss eines Harnstaus bestätigten die prärenale Genese. Die bestehende Medikation mit Ramipril und Hydrochlorothiazid hat die Nierenschädigung begünstigt; Metformin stellte bei eingeschränkter Nierenfunktion und Azidose ein zusätzliches Risiko dar.
Wir pausierten Ramipril, Hydrochlorothiazid und Metformin und führten über drei Tage eine intravenöse Volumentherapie durch. Die Hyperkaliämie behandelten wir einmalig mit Insulin/Glukose; im Verlauf normalisierten sich Kalium, Natrium und Säure-Basen-Haushalt unter Rehydratation. Das Kreatinin fiel auf 1,3 mg/dl. Die Durchfälle sistierten ab dem 05.09.
Ohne Antihypertensiva lagen die Blutdruckwerte bei 125–140/70 mmHg. Nach Physiotherapie erreichte Herr D. einen Barthel-Index von 80. Mit ihm und seiner Ehefrau besprachen wir die Sick-Day-Regeln. Wir entlassen ihn am 09.09. nach Hause.`,
procedere:`– Kontrolle von Kreatinin, Kalium und Natrium in einer Woche.
– Ramipril bitte erst nach stabiler Nierenfunktion und bei RR > 140/90 mmHg in reduzierter Dosis (2,5 mg) wieder ansetzen.
– Hydrochlorothiazid wurde bei Hyponatriämie und fehlender Indikation dauerhaft abgesetzt.
– Metformin bei eGFR ≥ 45 ml/min wieder beginnen, zunächst 500 mg 1-0-1. Bis dahin bitte BZ-Kontrollen.
– Sick-Day-Regeln: Bei Durchfall, Erbrechen oder Fieber Ramipril, Diuretika, Metformin und NSAR pausieren und ärztlich melden.
– Weiterführende Demenzdiagnostik ambulant (Gedächtnissprechstunde) empfohlen.`},

{id:'appe',fach:'chir',sub:'Viszeralchirurgie',titel:'Akute Appendizitis, laparoskopische Appendektomie',level:1,typ:'Entlassungsbericht',
pat:{name:'Herr Lukas P.',geb:'11.02.2002',sex:'m',alter:24},klinik:'Klinik für Allgemein-, Viszeral- und Gefäßchirurgie',von:'04.09.2026',bis:'07.09.2026',
roh:`AUFNAHME 04.09. 22:10 ZNA
24 J., m. Seit ca. 18 h Bauchschmerz, zunächst periumbilikal, jetzt re. Unterbauch. Übelkeit, 1x Erbrechen, Appetitlosigkeit. Kein Durchfall. Keine VE, keine Vor-OPs. Keine Dauermed. Allergie: keine. Student.

KU: T 38,1, RR 132/80, HF 96. Abd.: DS re. UB, McBurney +, Loslassschmerz +, Psoas-Zeichen +, lokale Abwehrspannung. DG vorhanden.
Alvarado 8.

Histo 06.09.: akute phlegmonöse Appendizitis, kein Anhalt für Malignität.

VERLAUF: postop. keine AB. Kostaufbau ab OP-Abend problemlos. Wunden reizlos, schmerzarm unter Metamizol/Ibuprofen. Stuhlgang 06.09. Entlassung 07.09. (POD 2).
Thromboseprophylaxe stationär Enoxaparin 40 mg s.c. bis Entlassung, danach nicht erforderlich.
AU bis 20.09. ausgestellt.`,
muster:{
diagnosen:`Akute phlegmonöse Appendizitis ohne Perforation (K35.8)

Vorerkrankungen und Voroperationen: keine. Dauermedikation: keine. Allergien: keine bekannt.`,

Abdomen: Druckschmerz im rechten Unterbauch mit positivem McBurney-Punkt, Loslassschmerz und positivem Psoas-Zeichen, lokale Abwehrspannung. Darmgeräusche vorhanden. Alvarado-Score 8.`,

Sonographie Abdomen (04.09.): Appendix mit 9 mm Durchmesser, nicht komprimierbar, Wandverdickung und Umgebungsreaktion, wenig freie Flüssigkeit, kein Abszess.
Histologie (06.09.): akute phlegmonöse Appendizitis, kein Anhalt für Malignität.`,
epikrise:`Bei typischer Anamnese mit Schmerzwanderung, klinischen Peritonismuszeichen, erhöhten Entzündungswerten und sonographisch eindeutigem Befund stellten wir die Indikation zur Appendektomie. Die laparoskopische Operation erfolgte am 05.09. komplikationslos und bestätigte eine phlegmonöse Appendizitis ohne Perforation. Perioperativ erhielt Herr P. eine Single-shot-Antibiose; eine postoperative Fortführung war bei unkompliziertem Befund nicht indiziert.
Der postoperative Verlauf war unauffällig. Der Kostaufbau gelang problemlos, die Wunden waren reizlos, die Schmerzen unter oraler Analgesie gut kontrolliert. Die Histologie ergab keinen Anhalt für Malignität. Wir entlassen Herrn P. am 2. postoperativen Tag in gutem Allgemeinzustand nach Hause.`,
procedere:`– Hautverschluss mit resorbierbarem Nahtmaterial, eine Fadenentfernung ist nicht erforderlich. Wundkontrolle beim Hausarzt in 3–5 Tagen.
– Duschen ist erlaubt, Baden erst nach vollständiger Wundheilung (ca. 10 Tage).
– Kein Heben schwerer Lasten (> 10 kg) und kein Sport für 2 Wochen.
– Analgesie bei Bedarf mit Ibuprofen 400 mg bis 3x täglich und Metamizol 500 mg bis 4x täglich.
– Keine medikamentöse Thromboseprophylaxe nach Entlassung erforderlich.
– Arbeitsunfähigkeit bis einschließlich 20.09.
– Bei Fieber, zunehmenden Bauchschmerzen oder Wundrötung bitte umgehende Wiedervorstellung.`},
med:[['Ibuprofen','400 mg','bei Bedarf bis 1-1-1-0','max. 7 Tage','neu'],['Metamizol','500 mg','bei Bedarf bis 1-1-1-1','','neu']],

{id:'shf',fach:'ortho',sub:'Unfallchirurgie',titel:'Schenkelhalsfraktur, Duokopfprothese',level:3,typ:'Verlegungsbericht',
pat:{name:'Frau Elfriede R.',geb:'23.07.1940',sex:'w',alter:86},klinik:'Klinik für Orthopädie und Unfallchirurgie',von:'05.09.2026',bis:'13.09.2026',
roh:`AUFNAHME 05.09. 06:30 via RD
86 J., w. Nachts beim Toilettengang über Teppich gestolpert, auf re. Hüfte gestürzt. Kein Bewusstseinsverlust, kein Schwindel, kein Kopfanprall. Kann nicht aufstehen.
VE: VHF (Rivaroxaban 15 mg, letzte Einnahme 04.09. 08:00), aHT, leichte Demenz (Alzheimer-Typ), CKD G3b.
Vormed.: Rivaroxaban 15 mg 1-0-0, Amlodipin 5 mg 1-0-0, Donepezil 5 mg 0-0-1
Allergien: keine. Lebt im betreuten Wohnen, Rollator, Barthel 75 vor Sturz. Tochter hat Vorsorgevollmacht.
Gew. 55 kg.

KU: Bein re. verkürzt, außenrotiert, Leistendruckschmerz, pDMS intakt. Keine weiteren Verletzungen. GCS 15, zeitl. desorientiert (bek.).
Rö Becken/Hüfte re.: mediale SHF re., Garden IV. Rö Thx: unauff.
Lab: Hb 12,4, Krea 1,3 (CrCl ca. 29 ml/min), K 4,2, Quick 72 %.
ASA 3.

OP 06.09. 09:00 (ca. 49 h nach letzter Rivaroxaban-Einnahme): zementierte Duokopfprothese re., anterolat. Zugang. Keine Komplikationen.
Postop Rö: regelrechter Prothesensitz.
Hb postop 8,9 -> 1 EK 07.09. -> 9,8.
POD 1–2: hypoaktives Delir (4AT 6), nicht-medikamentös (Reorientierung, Brille/Hörgerät, Tochter), abgeklungen POD 3.
Thromboseprophylaxe: Enoxaparin 40 mg 06.–07.09., Rivaroxaban 15 mg wieder ab 08.09.
Mobilisation Vollbelastung ab POD 1 mit Gehwagen, aktuell 20 m mit Rollator + 1 Person.
Wunde trocken, reizlos. Klammern.
Vit D 25-OH: 14 ng/ml -> Colecalciferol begonnen. Ca 2,3 mmol/l.
Verlegung 13.09. in geriatrische Frühreha (Klinik für Geriatrie).`,
muster:{
diagnosen:`Mediale Schenkelhalsfraktur rechts, Garden IV (S72.01)
– Zementierte Duokopfprothese rechts über anterolateralen Zugang am 06.09.2026
– Postoperative Blutungsanämie, Transfusion von 1 EK am 07.09.2026
– Postoperatives hypoaktives Delir (POD 1–2), rückläufig
Häuslicher Sturz, mechanisch
Osteoporose, klinisch manifest (Fraktur bei Bagatelltrauma), Vitamin-D-Mangel (25-OH-D 14 ng/ml)

Nebendiagnosen:
– Vorhofflimmern unter Rivaroxaban
– Arterielle Hypertonie
– Demenz vom Alzheimer-Typ, leichtgradig
– Chronische Nierenerkrankung G3b (CrCl ca. 29 ml/min)`,
anamnese:`Frau R. stürzte in der Nacht zum 05.09. beim Toilettengang über einen Teppich auf die rechte Hüfte. Ein Bewusstseinsverlust, Schwindel oder Kopfanprall wurden verneint. Ein selbstständiges Aufstehen war nicht mehr möglich.
Vorerkrankungen: Vorhofflimmern, arterielle Hypertonie, leichtgradige Demenz vom Alzheimer-Typ, CKD G3b.
Vormedikation: Rivaroxaban 15 mg 1-0-0 (letzte Einnahme 04.09., 08:00 Uhr), Amlodipin 5 mg 1-0-0, Donepezil 5 mg 0-0-1.
Allergien: keine bekannt.
Sozialanamnese: lebt im betreuten Wohnen, mit Rollator mobil, Barthel-Index vor dem Sturz 75. Die Tochter besitzt eine Vorsorgevollmacht.`,
befund:`86-jährige Patientin, 55 kg. GCS 15, zeitlich desorientiert (vorbekannt).
Rechtes Bein verkürzt und außenrotiert, Leistendruckschmerz rechts, periphere Durchblutung, Motorik und Sensibilität intakt. Keine Begleitverletzungen.`,
diagnostik:`Röntgen Becken und Hüfte rechts (05.09.): mediale Schenkelhalsfraktur rechts, Garden IV.
Röntgen-Thorax: unauffällig.
Labor (Aufnahme): Hb 12,4 g/dl, Kreatinin 1,3 mg/dl, Kalium 4,2 mmol/l, Quick 72 %. Postoperativ Hb 8,9 g/dl, nach Transfusion 9,8 g/dl. 25-OH-Vitamin D 14 ng/ml, Calcium 2,3 mmol/l.
Postoperatives Röntgen: regelrechter Sitz der Duokopfprothese.`,
epikrise:`Frau R. zog sich bei einem mechanischen häuslichen Sturz eine dislozierte mediale Schenkelhalsfraktur rechts zu. Unter laufender Antikoagulation mit Rivaroxaban und eingeschränkter Nierenfunktion erfolgte die operative Versorgung nach einem Intervall von 49 Stunden seit der letzten Einnahme am 06.09. Wir implantierten eine zementierte Duokopfprothese. Die Operation verlief komplikationslos.
Postoperativ transfundierten wir bei Blutungsanämie ein Erythrozytenkonzentrat. Am 1. und 2. postoperativen Tag trat ein hypoaktives Delir auf, das unter nicht-medikamentösen Maßnahmen bis zum 3. Tag abklang. Nach überbrückender Thromboseprophylaxe mit Enoxaparin setzten wir Rivaroxaban am 08.09. wieder an.
Frau R. wurde ab dem 1. postoperativen Tag unter Vollbelastung mobilisiert und geht derzeit 20 m mit Rollator und Unterstützung einer Person. Die Wunde ist trocken und reizlos. Den Vitamin-D-Mangel haben wir behandelt. Zur weiteren Mobilisation verlegen wir Frau R. am 13.09. in Ihre geriatrische Frührehabilitation.`,
procedere:`– Vollbelastung rechts erlaubt. Für 6 Wochen keine extremen Bewegungen (tiefe Hocke, Beine überschlagen, forcierte Außenrotation in Streckung), Luxationsprophylaxe nach Physiotherapie-Standard.
– Entfernung der Hautklammern am 12.–14. postoperativen Tag (18.–20.09.).
– Rivaroxaban 15 mg ersetzt die Thromboseprophylaxe, keine zusätzliche Heparingabe.
– Osteoporose: Wir empfehlen nach Ausschluss von Kontraindikationen (Zahnstatus, Calcium, Nierenfunktion) die Einleitung einer spezifischen Therapie, bei CrCl < 35 ml/min z. B. mit Denosumab statt Bisphosphonat. Fortführung von Colecalciferol.
– Sturzprophylaxe (Stolperfallen, Nachtlicht, Hüftprotektoren) vor Rückkehr ins betreute Wohnen.
– Röntgenkontrolle der Prothese nach 6 Wochen.`},

{id:'stroke',fach:'neuro',sub:'Stroke Unit',titel:'Ischämischer Schlaganfall mit Thrombektomie',level:3,typ:'Entlassungsbericht',
pat:{name:'Herr Andreas T.',geb:'30.09.1954',sex:'m',alter:71},klinik:'Klinik für Neurologie · Stroke Unit',von:'08.09.2026',bis:'15.09.2026',
roh:`AUFNAHME 08.09. 09:05 via RD (Stroke-Alarm)
71 J., m. Last seen well 08:10 (Frühstück mit Ehefrau), dann plötzl. Schwäche li. Arm/Bein, verwaschene Sprache.
VE: aHT, Hypercholesterinämie (keine Therapie). Keine AK. Nichtraucher.
Vormed.: Ramipril 5 mg 1-0-0.
Allergien: keine. Verh., Rentner, selbstständig, fährt Auto. mRS vorher 0.

KU: RR 172/94, HF 88 arrhythm., BZ 118. NIHSS 9 (Hemiparese li. brachiofazial betont, Dysarthrie, Neglect leicht).
CT/CTA/CTP 08.09.: keine Blutung, ASPECTS 9, Verschluss M1 re., Mismatch.
09:32 i.v. Tenecteplase 0,25 mg/kg (Gew. 82 kg = 20 mg).
Mechan. Thrombektomie 10:05–10:40: TICI 3 nach 1 Pass.
MRT 09.09.: kleiner Infarkt Stammganglien/Insel re., keine Blutung.
Telemetrie: VHF paroxysmal, neu.
TTE: LA dilatiert, LVEF 55 %, kein Thrombus.
Lab: LDL 128 mg/dl, HbA1c 5,6 %, TSH normal.
Duplex extrakraniell: keine relev. Stenosen.

VERLAUF: NIHSS 9 -> 4 (09.09.) -> 2 bei Entlassung (leichte zentr. Fazialisparese li., leichte Dysarthrie). mRS 1.
Schluckscreening 09.09. unauff.
ASS 100 ab 09.09. (24 h nach Lyse, nach Kontroll-Bildgebung), gestoppt bei Beginn Apixaban 12.09. (Tag 4, kleiner Infarkt).
Atorvastatin 40 mg ab 09.09.
RR 130–145/80. Ramipril 5 -> 10 mg.
Logo + Ergo + Physio. Fahreignung besprochen: derzeit nicht gegeben.
Entlassung 15.09. nach Hause, ambulante Logopädie.`,
muster:{
diagnosen:`Ischämischer Schlaganfall im Mediastromgebiet rechts (I63.4) bei Verschluss der A. cerebri media (M1) rechts
– Ätiologie: kardioembolisch bei neu diagnostiziertem paroxysmalem Vorhofflimmern
– Systemische Thrombolyse mit Tenecteplase am 08.09.2026 (Door-to-needle 27 min)
– Mechanische Thrombektomie am 08.09.2026, Rekanalisation TICI 3
– NIHSS bei Aufnahme 9, bei Entlassung 2; mRS bei Entlassung 1
Paroxysmales Vorhofflimmern, Erstdiagnose, CHA2DS2-VA 4

Nebendiagnosen:
– Arterielle Hypertonie
– Hypercholesterinämie (LDL-C 128 mg/dl)`,
anamnese:`Herr T. wurde am 08.09. über den Rettungsdienst unter Stroke-Alarm vorgestellt. Er sei um 08:10 Uhr beim Frühstück mit seiner Ehefrau zuletzt beschwerdefrei gewesen und habe dann plötzlich eine Schwäche des linken Arms und Beins sowie eine verwaschene Sprache entwickelt.
Vorerkrankungen: arterielle Hypertonie, unbehandelte Hypercholesterinämie. Keine Antikoagulation.
Vormedikation: Ramipril 5 mg 1-0-0.
Allergien: keine bekannt. Nichtraucher.
Sozialanamnese: verheiratet, Rentner, vollständig selbstständig (prämorbider mRS 0), aktiver Autofahrer.`,
befund:`RR 172/94 mmHg, HF 88/min arrhythmisch, BZ 118 mg/dl.
Neurologisch: brachiofazial betonte Hemiparese links, Dysarthrie, leichter visueller Neglect nach links. NIHSS 9.`,
diagnostik:`CT, CT-Angiographie und CT-Perfusion (08.09.): keine Blutung, ASPECTS 9, Verschluss der A. cerebri media (M1) rechts mit Perfusions-Mismatch.
MRT (09.09.): kleiner Infarkt in Stammganglien und Insel rechts, keine Einblutung.
Duplexsonographie extrakraniell: keine relevanten Stenosen.
TTE: linker Vorhof dilatiert, LVEF 55 %, kein intrakardialer Thrombus.
Telemetrie: paroxysmales Vorhofflimmern.
Labor: LDL-C 128 mg/dl, HbA1c 5,6 %, TSH normal.`,
epikrise:`Herr T. wurde 55 Minuten nach Symptombeginn mit einem schweren Mediasyndrom rechts aufgenommen. Bei Verschluss der A. cerebri media rechts ohne Blutung führten wir eine systemische Thrombolyse mit Tenecteplase und anschließend eine mechanische Thrombektomie durch, die eine vollständige Rekanalisation (TICI 3) erzielte. Das MRT zeigte nur noch einen kleinen Infarkt. Die neurologische Symptomatik bildete sich deutlich zurück (NIHSS 9 → 2).
Als Ursache fanden wir ein bislang unbekanntes paroxysmales Vorhofflimmern. Nach Kontrollbildgebung begannen wir 24 Stunden nach Lyse ASS und stellten bei kleinem Infarktvolumen am 4. Tag auf Apixaban um. Zusätzlich begannen wir Atorvastatin und steigerten Ramipril. Das Schluckscreening war unauffällig.
Unter Physio-, Ergo- und Logotherapie besserte sich die Symptomatik weiter. Über die derzeit fehlende Fahreignung haben wir Herrn T. aufgeklärt. Wir entlassen ihn am 15.09. mit einem mRS von 1 nach Hause.`,
procedere:`– Dauerhafte orale Antikoagulation mit Apixaban 5 mg 1-0-1. Keine zusätzliche Thrombozytenaggregationshemmung.
– LDL-C-Kontrolle in 6 Wochen, Ziel < 70 mg/dl (bzw. < 55 mg/dl bei zusätzlicher KHK); ggf. Ezetimib ergänzen.
– Blutdruckziel < 130/80 mmHg, bitte weitere Einstellung.
– Ambulante Logopädie ist verordnet. Physiotherapie bei Bedarf.
– Fahreignung derzeit nicht gegeben. Neubeurteilung durch einen Neurologen gemäß Begutachtungsleitlinien in frühestens 3 Monaten.
– Neurologische Kontrolle in 3 Monaten.
– Bei neuen neurologischen Ausfällen sofort 112.`},
med:[['Apixaban','5 mg','1-0-1-0','dauerhaft','neu'],['Atorvastatin','40 mg','0-0-1-0','','neu'],['Ramipril','10 mg','1-0-0-0','','geändert']],

{id:'eug',fach:'gyn',sub:'Gynäkologie',titel:'Tubargravidität, laparoskopische Salpingektomie',level:2,typ:'Entlassungsbericht',
pat:{name:'Frau Nadine Y.',geb:'05.04.1997',sex:'w',alter:29},klinik:'Frauenklinik',von:'02.09.2026',bis:'04.09.2026',
roh:`AUFNAHME 02.09. Kreißsaal-Ambulanz
29 J., G2 P1 (Spontangeburt 2023). LP 17.07. -> 7+2 SSW rechnerisch. Seit 2 d Schmierblutung, seit heute ziehender Schmerz li. Unterbauch. Kein Schwindel.
VE: keine. Z.n. Chlamydien-Infektion 2019 (behandelt). Keine Dauermed. Allergien: keine.
Blutgruppe: A Rh negativ, AK-Suchtest neg.

KU: RR 118/72, HF 84. Abd. weich, DS li. UB, keine Abwehr. Spekulum: wenig Blut aus Zervix. Portioschiebeschmerz li. +.
TVUS: Uterus leer, Endometrium 11 mm, kein intrauteriner Fruchtsack. Li. Adnexe: inhomogene Raumforderung 2,3 cm neben Ovar ("blob sign"), wenig freie Flüssigkeit im Douglas. Re. Adnexe unauff.
β-hCG 02.09.: 2.480 IU/l. Hb 12,1.

OP 02.09. 18:30: diagnost. Laparoskopie -> tubare EUG ampullär li., nicht rupturiert, Hämatoperitoneum ca. 50 ml. Tube re. makroskopisch unauff. -> laparosk. Salpingektomie li. (Aufklärung präop. über Salpingektomie vs. Salpingotomie, Pat. wünscht Salpingektomie).
Anti-D 300 µg i.m. 03.09.
Histo 04.09.: Tubenwand mit Chorionzotten, EUG bestätigt.
β-hCG 03.09.: 890 IU/l.
VERLAUF: unauff., mobil, Wunden reizlos, Hb 11,4. Psych. entlastendes Gespräch. Entlassung 04.09.`,
muster:{
diagnosen:`Tubargravidität links, ampullär, nicht rupturiert (O00.1), 7+2 SSW
– Laparoskopische Salpingektomie links am 02.09.2026
– Histologie: Chorionzotten in der Tubenwand, Extrauteringravidität bestätigt
Rhesus-negative Blutgruppe (A Rh neg.)
– Anti-D-Prophylaxe 300 µg i.m. am 03.09.2026

Nebendiagnosen:
– Z. n. Chlamydien-Infektion 2019 (behandelt)
– G2 P1 (Spontangeburt 2023)`,
anamnese:`Frau Y. stellte sich in der 7+2 SSW (rechnerisch nach letzter Periode am 17.07.) mit seit zwei Tagen bestehender Schmierblutung und seit dem Aufnahmetag ziehenden Schmerzen im linken Unterbauch vor. Schwindel oder Kreislaufbeschwerden wurden verneint.
Gynäkologische Anamnese: G2 P1, Spontangeburt 2023. Z. n. behandelter Chlamydien-Infektion 2019.
Vorerkrankungen: keine. Dauermedikation: keine. Allergien: keine bekannt.`,
befund:`29-jährige Patientin in gutem Allgemeinzustand, RR 118/72 mmHg, HF 84/min.
Abdomen weich, Druckschmerz im linken Unterbauch ohne Abwehrspannung.
Spekulumeinstellung: geringe Blutung aus dem Zervikalkanal. Portioschiebeschmerz links.`,
diagnostik:`Transvaginalsonographie (02.09.): Cavum uteri leer, Endometrium 11 mm, kein intrauteriner Fruchtsack. Neben dem linken Ovar inhomogene Raumforderung von 2,3 cm, wenig freie Flüssigkeit im Douglas-Raum. Rechte Adnexe unauffällig.
Labor: β-hCG 2.480 IU/l (02.09.), postoperativ 890 IU/l (03.09.). Hb 12,1 g/dl, postoperativ 11,4 g/dl. Blutgruppe A Rh negativ, Antikörpersuchtest negativ.
Histologie (04.09.): Tubenwand mit Chorionzotten, Extrauteringravidität bestätigt.`,
epikrise:`Bei positivem β-hCG oberhalb der Diskriminationszone, leerem Cavum uteri und einer Raumforderung neben dem linken Ovar bestand der dringende Verdacht auf eine Tubargravidität links. Bei Schmerzen und freier Flüssigkeit im Douglas-Raum führten wir noch am Aufnahmetag die diagnostische Laparoskopie durch. Es bestätigte sich eine nicht rupturierte ampulläre Tubargravidität links. Bei makroskopisch unauffälliger Gegenseite und nach ausführlicher Aufklärung erfolgte auf Wunsch von Frau Y. die Salpingektomie links. Die Histologie bestätigte den Befund.
Bei Rhesus-negativer Blutgruppe verabreichten wir eine Anti-D-Prophylaxe. Der postoperative Verlauf war unauffällig, das β-hCG deutlich abfallend. Wir führten ein entlastendes Gespräch zur Verarbeitung des Schwangerschaftsverlustes. Wir entlassen Frau Y. am 04.09. in gutem Allgemeinzustand.`,
procedere:`– Nach Salpingektomie und histologischer Bestätigung sind keine weiteren β-hCG-Kontrollen erforderlich. Bei anhaltender Blutung oder Schmerzen bitte Kontrolle.
– Resorbierbares Nahtmaterial, keine Fadenentfernung. Wundkontrolle in Ihrer Praxis.
– Körperliche Schonung für 1–2 Wochen, Geschlechtsverkehr nach Abklingen der Blutung möglich.
– Eine erneute Schwangerschaft ist ab dem nächsten Zyklus möglich. Bei erhöhtem Rezidivrisiko bitte frühzeitige Ultraschallkontrolle (ab 5–6 SSW) zur Lokalisation.
– Bei Bedarf psychologische Unterstützung (Kontakt zur Beratungsstelle wurde übergeben).`},
med:[['Ibuprofen','400 mg','bei Bedarf bis 1-1-1-0','max. 5 Tage','neu']],
check:['Lokalisation und Rupturstatus der EUG','SSW und G/P-Status','Begründung der operativen Therapie (hCG, Schmerz, freie Flüssigkeit)','Aufklärung Salpingektomie vs. Salpingotomie','Rhesusstatus und Anti-D-Gabe','Histologische Bestätigung','hCG-Verlauf und ob Kontrollen nötig sind','Beratung zu Folgeschwangerschaft','Psychosoziale Aspekte'],

{id:'bronch',fach:'paed',sub:'Säuglinge',titel:'RSV-Bronchiolitis beim Säugling',level:1,typ:'Entlassungsbericht',
pat:{name:'Mia K.',geb:'14.05.2026',sex:'w',alter:0},klinik:'Klinik für Kinder- und Jugendmedizin',von:'10.09.2026',bis:'15.09.2026',
roh:`AUFNAHME 10.09. Kinder-NA, Überweisung KiA
